<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced Noor Al-Bayan Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial,Tahoma,sans-serif;color:#172033}
.wrap{max-width:760px;margin:auto;padding:16px}header{text-align:center;padding:10px 0 18px}header h1{margin:0 0 6px;font-size:25px}header p{margin:0;color:#667085}
.card{background:white;border:1px solid #d0d5dd;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000d}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#667085;font-size:14px}
.bar{height:8px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:14px 0 20px}#fill{height:100%;background:#2563eb}
.part{font-weight:700;color:#2563eb;margin-bottom:8px}h2{font-size:19px;line-height:1.55;margin:0 0 16px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid #d0d5dd;border-radius:11px;margin:10px 0;cursor:pointer;line-height:1.45}
.opt input{width:20px;height:20px;flex:0 0 auto}.fb{display:none;margin-top:15px;padding:12px;border-radius:10px;font-weight:700}
.ok{display:block;background:#ecfdf3;color:#15803d;border:1px solid #abefc6}.no{display:block;background:#fef3f2;color:#b42318;border:1px solid #fecdca}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white}.secondary{background:#eef2f6;color:#172033}.result{text-align:center}.big{font-size:40px;font-weight:800;margin:15px}
.note{font-size:12px;color:#667085;text-align:center;margin-top:14px}
@media(max-width:500px){.wrap{padding:10px}.card{padding:15px}h2{font-size:18px}button{width:100%}}
</style></head>
<body><div class="wrap">
<header><h1>Advanced Noor Al-Bayan Quiz</h1><p>اختبار نور البيان المتقدم</p></header>
<section id="quiz" class="card"><div class="top"><span id="count"></span><span id="score"></span></div><div class="bar"><div id="fill"></div></div>
<div id="part" class="part"></div><h2 id="q"></h2><div id="opts"></div><div id="fb" class="fb" aria-live="polite"></div>
<div class="actions"><button id="check" class="primary">Check Answer</button><button id="next" class="secondary" style="display:none">Next Question →</button></div></section>
<section id="result" class="card result" style="display:none"><h2>Quiz Completed — تم الانتهاء من الاختبار</h2><div id="final" class="big"></div><p id="msg"></p><button id="restart" class="primary">Restart Quiz</button></section>
<div class="note">Advanced Tajweed / Noor Al-Bayan practice quiz</div></div>
<script>
const questions=[{"part": "Part 1: Advanced Blending & Phonetic Analysis", "q": "Analyze the letters of the word {إِصْلَاحٌ} into their individual components with accurate Harakaat:", "o": ["إِ - صْ - لَا - حٌ", "أ - ص - ل - ح", "إِ - صَ - لَ - حَ"], "a": 0}, {"part": "Part 1: Advanced Blending & Phonetic Analysis", "q": "When blending the letters {يَ + سْتَ + خْرِ + جُ}, what is the correct resulting connected word and its primary phonetic feature?", "o": ["يَسْتَخْرِجُ (Contains a letter with Sukun and letters with Harakaat)", "يَسْتَخْرِجْ (Ends with absolute Sukun due to stop)", "يَسْتَخْرِجَا (Contains an Alif of duality)"], "a": 0}, {"part": "Part 2: Madd Rules & Comparative Quantities", "q": "In the word {وَالسَّمَاءِ}, identify the type and mandatory minimum count (Harakas) of the Madd:", "o": ["Madd Tabii (Natural Madd) - 2 Harakas", "Madd Muttasil Wajib (Obligatory Connected Madd) - 4 or 5 Harakas", "Madd Munfasil Jaiz (Permissible Separated Madd) - 2 to 4 Harakas"], "a": 1}, {"part": "Part 2: Madd Rules & Comparative Quantities", "q": "What distinguishes Madd Lazim (Compulsory Madd) from other types of Madd?", "o": ["It is followed by a permanent Sukun or a heavy Shaddah in both a word or a disjointed letter.", "It only appears at the very beginning of specific Surahs.", "It is optional for the reader to lengthen it or keep it short."], "a": 0}, {"part": "Part 3: Sukun, Shaddah, and Assimilation Rules", "q": "How should a heavy Shaddah (e.g., {رَبُّكُمْ}) be practically executed according to phonetic rules?", "o": ["Pronounced as one single fast letter without stopping.", "Broken down into two distinct letters: the first is quiescent (Saakin) merging into the second vowelled (Mutaharrik) letter.", "Lengthened for 3 full seconds as a form of Ghunnah."], "a": 1}, {"part": "Part 3: Sukun, Shaddah, and Assimilation Rules", "q": "Identify the rule when a Noon Saakinah or Tanween is followed by the letter (ل) in {مِن لَّدُنْهُمْ}:", "o": ["Idgham Bila Ghunnah (Assimilation without nasalization)", "Ikhfa' (Concealment)", "Izhar (Clear pronunciation)"], "a": 0}, {"part": "Part 4: Advanced Application & Practical Reading", "q": "When stopping on a word ending with Tanween Fath (e.g., {عَلِيمًا}), how is it pronounced according to Arabic phonetics?", "o": ["It is pronounced as a normal Kasra.", "It is substituted with a prolonged Alif (Madd Iwad) of 2 Harakas ({عَلِيمَا}).", "The Tanween remains completely unchanged."], "a": 1}, {"part": "Part 4: Advanced Application & Practical Reading", "q": "In the phrase {قُل هُوَ اللَّهُ}, what happens to the Lam in {قُل} when connecting it to {هُوَ}?", "o": ["It undergoes Idgham (Assimilation) into the Ha.", "It is pronounced clearly (Izhar); the Lam remains audible.", "It is dropped completely from speech."], "a": 1}, {"part": "Part 5: Hamzat Al-Wasl & Al-Qat'", "q": "When starting the recitation with a word beginning with Hamzat Al-Wasl whose third letter has a Damma (e.g., {اُدْخُلُوا}), how should the Hamzah be pronounced?", "o": ["With a clear Fatha.", "With a Damma (ضمّة تتبع ثالث الفعل when the relevant rule applies).", "It is dropped completely."], "a": 1}, {"part": "Part 5: Hamzat Al-Wasl & Al-Qat'", "q": "What differentiates Hamzat Al-Wasl from Hamzat Al-Qat' in a sentence?", "o": ["Hamzat Al-Wasl is pronounced only when starting, and drops when continuing; whereas Hamzat Al-Qat' is pronounced in all cases.", "Hamzat Al-Qat' only appears at the very end of words.", "There is no phonetic difference between them."], "a": 0}, {"part": "Part 6: Meem Saakinah Rules", "q": "Identify the rule when a Meem Saakinah is followed by the letter (ب) (e.g., {رَبُّهُم بِهِم}):", "o": ["Idgham Shafawi (Labial Assimilation with Ghunnah)", "Ikhfa' Shafawi (Labial Concealment with Ghunnah)", "Izhar Shafawi (Clear Labial Pronunciation)"], "a": 1}, {"part": "Part 6: Meem Saakinah Rules", "q": "Why is the rule called Izhar Shafawi (Clear Labial Pronunciation) when Meem Saakinah is followed by letters other than (ب) and (م)?", "o": ["Because the lips are tightly closed during the sound.", "Because the articulation point (Makhraj) of the Meem involves the lips (شفة).", "Because it requires a long nasalization (Ghunnah) exceeding 3 seconds."], "a": 1}, {"part": "Part 7: Stopping Rules & Waqf", "q": "If you stop on a word ending with a regular Fatha, Kasra, or Damma, what generally happens to the final vowel?", "o": ["It remains pronounced clearly.", "It converts into a Sukun (السكون العارض للوقف).", "It turns into a Tanween."], "a": 1}, {"part": "Part 7: Stopping Rules & Waqf", "q": "When stopping on a word ending with a feminine Taa (تاء مربوطة e.g., {رَحْمَةً} or {الْجَنَّةُ}), how is it pronounced?", "o": ["It changes into a quiescent Ha (هاء ساكنة عند الوقف).", "It is pronounced strictly as an open Taa with Damma.", "It is completely omitted from speech."], "a": 0}, {"part": "Part 8: Advanced Phonics & Letter Characteristics", "q": "What is the phonetic characteristic of Qalqalah and which letters does it apply to?", "o": ["A vibration or bounce in the sound when a Qalqalah letter is Saakin; the letters are ق ط ب ج د (قطب جد).", "Lengthening the sound of the letter for 6 counts, applying to Madd letters.", "Softening the airflow, applying to throat letters."], "a": 0}, {"part": "Part 8: Advanced Phonics & Letter Characteristics", "q": "In the transition of {أَلَمْ نَخْلُقْكُم}, how is the Qaf followed by Kaf read in Hafs?", "o": ["The Qaf is assimilated into the Kaf (Idgham of the first into the second), with the taught performance preserving the relevant Qaf characteristic.", "Both are always pronounced completely separately with no assimilation.", "The first letter is simply deleted with no phonetic trace."], "a": 0}, {"part": "Part 9: Al-Lam Al-Shamsiyyah & Al-Qamariyyah", "q": "In the phrase {وَالشَّمْسِ}, why is the Lam dropped from pronunciation, and how does the following letter behave?", "o": ["Because Shin is a moon letter; the Lam becomes silent and the Shin takes a Shaddah.", "Because Shin is a sun letter; the Lam assimilates into the Shin, which is pronounced with Shaddah.", "Because the Lam transforms into an Alif."], "a": 1}, {"part": "Part 9: Al-Lam Al-Shamsiyyah & Al-Qamariyyah", "q": "Identify the correct phonetic rule for the Lam in the word {الْقَمَرُ} and state why:", "o": ["Lam Shamsiyyah; because Qaf is a throat letter.", "Lam Qamariyyah; because Qaf is a moon letter, so the Lam is pronounced clearly.", "It is completely merged into the Mim."], "a": 1}, {"part": "Part 9: Al-Lam Al-Shamsiyyah & Al-Qamariyyah", "q": "What is the phonetic status of the Lam in the word {اللَّه} (Lafẓ al-Jalālah)?", "o": ["Always treated as an absolute Qamari Lam.", "Its Tafkhim (heavy) or Tarqiq (light) depends on the vowel immediately preceding it.", "Always dropped when preceded by a Fatha."], "a": 1}, {"part": "Part 10: Advanced Noor Al-Bayan Blending & Silent Letters", "q": "In {فَبِمَا لَمْ يَسْتَجِيبُواْ}, how should the extra written Alif after the plural Waw at the end of {يستجيبوا} be handled in recitation?", "o": ["Pronounce the Alif clearly with a 2-count Madd.", "The extra Alif is not pronounced; the Waw before it is the pronounced Madd letter.", "Convert the Alif into a Waw."], "a": 1}, {"part": "Part 10: Advanced Noor Al-Bayan Blending & Silent Letters", "q": "In the disjointed letters {كهيعص}, which of the following contains Madd Lazim Harfi of 6 counts?", "o": ["The letter هَا only.", "The letters عَيْن and صَاد only.", "كَاف and صَاد are clear 6-count Madd Lazim Harfi examples; عَيْن has its special accepted lengthening treatment."], "a": 2}, {"part": "Part 11: Advanced Hamzat Al-Wasl Transitions", "q": "What happens practically when a word ending with a Saakin letter meets a Hamzat Al-Wasl starting the next word (e.g., {قُلِ ادْعُوا اللَّهَ})?", "o": ["The first Saakin may be given a temporary vowel (here Kasra) to avoid two consecutive Saakin letters.", "Both letters are deleted.", "The Hamzat Al-Wasl is emphasized with a Fatha."], "a": 0}, {"part": "Part 11: Advanced Hamzat Al-Wasl Transitions", "q": "When beginning with a standard noun that starts with Hamzat Al-Wasl (such as {ابْن}), how is Hamzat Al-Wasl generally begun?", "o": ["With Kasra.", "With Damma.", "With Fatha only."], "a": 0}];
let i=0,points=0,locked=false;
const E=id=>document.getElementById(id);
function render(){
 locked=false;const x=questions[i];E("count").textContent=`Question ${i+1} of ${questions.length}`;E("score").textContent=`Score: ${points} / ${questions.length}`;E("fill").style.width=`${(i+1)/questions.length*100}%`;E("part").textContent=x.part;E("q").textContent=x.q;
 E("opts").innerHTML=x.o.map((v,j)=>`<label class="opt"><input type="radio" name="ans" value="${j}"><span>${String.fromCharCode(97+j)}) ${v}</span></label>`).join("");
 E("fb").className="fb";E("fb").textContent="";E("check").style.display="inline-block";E("next").style.display="none";
}
E("check").onclick=()=>{if(locked)return;const s=document.querySelector('input[name="ans"]:checked');if(!s){E("fb").className="fb no";E("fb").textContent="Please choose an answer first.";return}locked=true;document.querySelectorAll('input[name="ans"]').forEach(x=>x.disabled=true);const right=Number(s.value)===questions[i].a;if(right)points++;E("fb").className="fb "+(right?"ok":"no");E("fb").textContent=right?"✓ Correct!":"✗ Incorrect. Correct answer: "+questions[i].o[questions[i].a];E("score").textContent=`Score: ${points} / ${questions.length}`;E("check").style.display="none";E("next").style.display="inline-block";E("next").textContent=i===questions.length-1?"Show Final Result":"Next Question →";};
E("next").onclick=()=>{if(i<questions.length-1){i++;render()}else{E("quiz").style.display="none";E("result").style.display="block";const pct=Math.round(points/questions.length*100);E("final").textContent=`${points} / ${questions.length} — ${pct}%`;E("msg").textContent=pct>=90?"Excellent performance!":pct>=75?"Very good. Review the missed rules.":pct>=60?"Good start. More review is recommended.":"Review the rules carefully and try again.";}};
E("restart").onclick=()=>{i=0;points=0;E("result").style.display="none";E("quiz").style.display="block";render()};render();
</script></body></html>
