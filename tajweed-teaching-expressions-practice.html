<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teaching Expressions</title>
<style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}.w{max-width:760px;margin:auto;padding:18px}.h{text-align:center;color:#174b7a}.c{background:#fff;padding:24px;border-radius:18px;box-shadow:0 5px 22px #0001;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.b,.next,.opt,.menu{border-radius:12px;padding:15px;font-size:17px;cursor:pointer}.b{background:#f7fbff;border:1px solid #d7e3ef;font-weight:bold}.expr{font-size:26px;font-weight:bold;margin:16px 0}.ar{font-size:24px;direction:rtl;margin:16px 0;color:#17517f}.ex{background:#f5f7fa;padding:14px;border-radius:10px}.opts{display:grid;gap:10px;margin:20px 0}.opt{text-align:left;background:white;border:2px solid #dce5ee}.sel{border-color:#2874b7;background:#eef7ff}.ok{border-color:#25823a;background:#effaf2}.bad{border-color:#c53c3c;background:#fff0f0}.next{width:100%;border:0;background:#2169a7;color:white;font-weight:bold}.next:disabled{opacity:.4}.menu{display:block;margin:46px auto 8px;background:white;border:1px solid #bcc8d4;color:#607080;padding:9px 25px}.meta{display:flex;justify-content:space-between;color:#667085;font-size:14px}.flash{text-align:center}.score{text-align:center;font-size:48px;font-weight:bold;color:#2169a7}@media(max-width:550px){.grid{grid-template-columns:1fr}.w{padding:10px}}</style></head>
<body><div class="w"><h1 class="h">Teaching Expressions Practice</h1><div id="app"></div></div>
<script>const D=[{"e": "Let’s do a quick recap.", "a": "دعنا نعمل مراجعة سريعة", "x": "Let’s do a quick recap before we start."}, {"e": "What did we learn last time?", "a": "ماذا تعلمنا في المرة السابقة؟", "x": "What did we learn last time about Noon Sakinah?"}, {"e": "Can you remember one example?", "a": "هل تستطيع تذكر مثال واحد؟", "x": "Can you remember one example from the last lesson?"}, {"e": "Are you ready for today’s lesson?", "a": "هل أنت مستعد لدرس اليوم؟", "x": "Are you ready for today’s lesson? Great!"}, {"e": "Let’s start with Bismillah.", "a": "لنبدأ ببسم الله", "x": "Let’s start with Bismillah."}, {"e": "Today, we are going to learn about…", "a": "اليوم سوف نتعلم عن...", "x": "Today, we are going to learn about Izhar."}, {"e": "Listen carefully.", "a": "استمع جيدًا", "x": "Listen carefully to the Noon sound."}, {"e": "Look at this example.", "a": "انظر إلى هذا المثال", "x": "Look at this example: Min Haadin."}, {"e": "Can you see…?", "a": "هل تستطيع أن ترى...؟", "x": "Can you see the Noon Sakinah?"}, {"e": "Can you hear the N sound?", "a": "هل تستطيع سماع صوت النون؟", "x": "Can you hear the N sound at the end?"}, {"e": "Which letter comes after…?", "a": "أي حرف يأتي بعد...؟", "x": "Which letter comes after Noon Sakinah?"}, {"e": "Izhar means clear.", "a": "الإظهار يعني الوضوح", "x": "Izhar means clear."}, {"e": "Idgham means merging.", "a": "الإدغام يعني الدمج", "x": "Idgham means merging."}, {"e": "Pronounce it clearly.", "a": "انطقها بوضوح", "x": "Pronounce the Noon clearly."}, {"e": "Merge into the next letter.", "a": "اندمج في الحرف التالي", "x": "The Noon sound merges into the next letter."}, {"e": "Noon Sakinah is a Noon with Sukoon.", "a": "النون الساكنة هي نون عليها سكون", "x": "Noon Sakinah is a Noon with Sukoon."}, {"e": "Tanween gives us an N sound.", "a": "التنوين يعطينا صوت النون", "x": "Tanween gives us an N sound at the end of the word."}, {"e": "It comes from the throat.", "a": "يخرج من الحلق", "x": "This letter comes from the throat."}, {"e": "This is an Izhar letter.", "a": "هذا حرف من حروف الإظهار", "x": "Haa is an Izhar letter."}, {"e": "So this is Izhar.", "a": "إذن هذا إظهار", "x": "Haa comes after Noon, so this is Izhar."}, {"e": "Now it’s your turn.", "a": "الآن دورك", "x": "Now it’s your turn. Read this example."}, {"e": "Try it again.", "a": "حاول مرة أخرى", "x": "Good try. Try it again."}, {"e": "Let’s say it slowly.", "a": "دعنا نقولها ببطء", "x": "Let’s say it slowly together."}, {"e": "Good try.", "a": "محاولة جيدة", "x": "Good try. Listen and try again."}, {"e": "Much better.", "a": "أفضل بكثير", "x": "Yes, much better!"}, {"e": "Excellent. Keep going.", "a": "ممتاز، استمر", "x": "Excellent. Keep going."}, {"e": "Think carefully.", "a": "فكر جيدًا", "x": "Think carefully. Is it Izhar or Idgham?"}, {"e": "Why is this Izhar?", "a": "لماذا هذا إظهار؟", "x": "Why is this Izhar?"}, {"e": "Let’s compare them.", "a": "دعنا نقارن بينهما", "x": "Let’s compare Izhar and Idgham."}, {"e": "What is the difference?", "a": "ما الفرق؟", "x": "What is the difference between Izhar and Idgham?"}, {"e": "Let’s do a quick challenge.", "a": "دعنا نقوم بتحدٍ سريع", "x": "Let’s do a quick challenge: Izhar or Idgham?"}, {"e": "What did we learn today?", "a": "ماذا تعلمنا اليوم؟", "x": "What did we learn today?"}, {"e": "Can you remember the six letters?", "a": "هل تستطيع تذكر الحروف الستة؟", "x": "Can you remember the six Izhar letters?"}, {"e": "For homework…", "a": "بالنسبة للواجب...", "x": "For homework, find three examples of Izhar."}, {"e": "Keep practicing.", "a": "استمر في التدريب", "x": "Keep practicing at home."}, {"e": "Don’t worry about mistakes.", "a": "لا تقلق من الأخطاء", "x": "Don’t worry about mistakes. Try again."}];let qs=[],i=0,score=0,sel=null,checked=false,opts=[],mode="",wrong=[],fi=0;const A=document.getElementById("app");
function menu(){A.innerHTML=`<div class="c grid"><button class="b" onclick="learn()">📚 Learn<br><small>Flashcards</small></button><button class="b" onclick="start('m')">🧠 Meaning Quiz<br><small>English → Arabic</small></button><button class="b" onclick="start('s')">✍️ Complete the Sentence<br><small>Choose the expression</small></button><button class="b" onclick="start('f')">🏆 Final Challenge<br><small>Mixed practice</small></button></div>`}
function learn(){fi=0;flash()}function flash(){let q=D[fi];A.innerHTML=`<div class="c flash"><small>CARD ${fi+1} OF ${D.length}</small><div class="expr">${q.e}</div><div class="ar">${q.a}</div><div class="ex">${q.x}</div></div><button class="next" onclick="fi=Math.min(D.length-1,fi+1);flash()">NEXT</button><button class="menu" onclick="menu()">MENU</button>`}
function sh(a){return [...a].sort(()=>Math.random()-.5)}function start(m){mode=m;i=score=0;wrong=[];qs=sh(D.map(q=>({q,t:m==='f'?(Math.random()<.5?'m':'s'):m})));render()}
function blank(q){let p=q.e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return q.x.replace(new RegExp(p,'i'),'__________')}
function render(){let o=qs[i],q=o.q,others=sh(D.filter(x=>x!==q)).slice(0,2);opts=sh(o.t==='m'?[{v:q.a,k:1},...others.map(x=>({v:x.a,k:0}))]:[{v:q.e,k:1},...others.map(x=>({v:x.e,k:0}))]);sel=null;checked=false;let p=o.t==='m'?`What does this expression mean?<div class="expr">${q.e}</div>`:`Choose the best expression:<div class="ex">${blank(q)}</div>`;A.innerHTML=`<div class="c"><div class="meta"><span>Question ${i+1} of ${qs.length}</span><span>Score ${score}</span></div><h3>${p}</h3><div class="opts">${opts.map((x,n)=>`<button id="o${n}" class="opt" onclick="pick(${n})">${x.v}</button>`).join('')}</div><div id="fb"></div><button id="n" class="next" onclick="go()" disabled>CHECK ANSWER</button></div><button class="menu" onclick="menu()">MENU</button>`}
function pick(n){if(checked)return;sel=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));document.getElementById('o'+n).classList.add('sel');document.getElementById('n').disabled=false}
function go(){if(!checked){checked=true;if(opts[sel].k){score++;document.getElementById('o'+sel).classList.add('ok');fb.innerHTML='<p><b>✓ Correct!</b></p>'}else{wrong.push(qs[i].q.e);document.getElementById('o'+sel).classList.add('bad');let z=opts.findIndex(x=>x.k);document.getElementById('o'+z).classList.add('ok');fb.innerHTML='<p><b>✗ Correct answer: '+opts[z].v+'</b></p>'}document.getElementById('n').textContent=i===qs.length-1?'SEE RESULT':'NEXT'}else if(++i<qs.length)render();else result()}
function result(){let p=Math.round(score/qs.length*100),u=[...new Set(wrong)];A.innerHTML=`<div class="c"><div class="score">${score}/${qs.length}</div><h2 style="text-align:center">${p}%</h2>${u.length?'<h3>Expressions to Review</h3><ul>'+u.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p style="text-align:center">Excellent! No expressions to review.</p>'}<button class="next" onclick="start(mode)">TRY AGAIN</button></div><button class="menu" onclick="menu()">MENU</button>`}menu();</script></body></html>
