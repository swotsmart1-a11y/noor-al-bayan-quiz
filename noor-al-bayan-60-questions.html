<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:780px;margin:auto;padding:14px}header{text-align:center;padding:12px 0 18px}h1{font-size:25px;margin:0 0 7px}header p{margin:0;color:#667085}.card{background:#fff;border:1px solid #d0d5dd;border-radius:16px;padding:20px}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#667085;font-size:14px}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0 20px}#fill{height:100%;background:#2563eb}.part{color:#2563eb;font-weight:700;font-size:14px;margin-bottom:8px}#question{font-size:19px;line-height:1.55;margin:0 0 17px}.opt{display:flex;align-items:flex-start;gap:11px;border:1px solid #d0d5dd;border-radius:11px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.5}.opt input{width:20px;height:20px;flex:0 0 auto}.fb{display:none;margin-top:15px;padding:12px;border-radius:10px;font-weight:700}.ok{display:block;background:#ecfdf3;color:#15803d;border:1px solid #abefc6}.bad{display:block;background:#fef3f2;color:#b42318;border:1px solid #fecdca}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#eef2f6;color:#172033}.result{display:none;text-align:center}.big{font-size:42px;font-weight:800;margin:16px}.review{text-align:left;margin-top:18px;padding-top:15px;border-top:1px solid #e5e7eb}.foot{text-align:center;color:#667085;font-size:12px;margin:13px}@media(max-width:500px){.wrap{padding:10px}.card{padding:15px}#question{font-size:18px}button{width:100%}}</style></head>
<body><div class="wrap"><header><h1>Noor Al-Bayan — 60 Question Quiz</h1><p>اختبار نور البيان والتجويد — 60 سؤالًا</p></header><section id="quiz" class="card"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="bar"><div id="fill"></div></div><div id="part" class="part"></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="fb"></div><div class="actions"><button id="check" class="primary">Check Answer</button><button id="next" class="secondary" style="display:none">Next Question →</button></div></section><section id="result" class="card result"><h2>Quiz Completed — تم الانتهاء من الاختبار</h2><div id="final" class="big"></div><p id="message"></p><div id="review" class="review"></div><button id="restart" class="primary">Restart Quiz</button></section><div class="foot">Noor Al-Bayan / Tajweed Practice</div></div>

in, second vowelled", "One Madd letter", "A Tanween only"], "a": 0}, {"part": "Part 5: Sukun & Shaddah", "q": "In رَبُّكُمْ, the بّ is:", "o": ["A single light Ba", "A doubled/mushaddad Ba", "A silent Madd letter"], "a": 1}, {"part": "Part 5: Sukun & Shaddah", "q": "Which sign indicates Shaddah?", "o": ["ْ", "ّ", "ً"], "a": 1}, {"part": "Part 5: Sukun & Shaddah", "q": "Which sign indicates Sukun?", "o": ["ْ", "ُ", "ِ"], "a": 0}, {"part": "Part 5: Sukun & Shaddah", "q": "When stopping on a normally vowelled final consonant, the final short vowel generally:", "o": ["Changes to Sukun for the stop", "Becomes Tanween Fath", "Must remain pronounced"], "a": 0}, {"part": "Part 6: Tanween", "q": "Which word ends with Tanween Damm?", "o": ["كِتَابٌ", "كِتَابًا", "كِتَابٍ"], "a": 0}, {"part": "Part 6: Tanween", "q": "Which word ends with Tanween Kasr?", "o": ["كِتَابًا", "كِتَابٍ", "كِتَابٌ"], "a": 1}, {"part": "Part 6: Tanween", "q": "Which word ends with Tanween Fath?", "o": ["كِتَابٌ", "كِتَابٍ", "كِتَابًا"], "a": 2}, {"part": "Part 6: Tanween", "q": "Tanween is heard as an additional:", "o": ["Noon Saakinah sound at the end when continuing", "Madd letter at the beginning", "Shaddah on every final letter"], "a": 0}, {"part": "Part 6: Tanween", "q": "When stopping on a word ending with Tanween Damm, the Tanween is generally:", "o": ["Pronounced fully", "Dropped and the final letter is stopped with Sukun", "Changed to Tanween Fath"], "a": 1}, {"part": "Part 7: Noon Saakinah & Tanween", "q": "Noon Saakinah or Tanween followed by ل takes which rule?", "o": ["Idgham without Ghunnah", "Ikhfa", "Iqlab"], "a": 0}, {"part": "Part 7: Noon Saakinah & Tanween", "q": "Noon Saakinah or Tanween followed by ب takes which rule?", "o": ["Izhar", "Iqlab", "Idgham without Ghunnah"], "a": 1}, {"part": "Part 7: Noon Saakinah & Tanween", "q": "Which set contains the six throat letters of Izhar Halqi?", "o": ["ء ه ع ح غ خ", "ي ر م ل و ن", "ص ذ ث ك ج ش"], "a": 0}, {"part": "Part 7: Noon Saakinah & id=>document.getElementById(id);function render(){locked=false;const x=questions[i];E("counter").textContent=`Question ${i+1} of ${questions.length}`;E("score").textContent=`Score: ${points} / ${questions.length}`;E("fill").style.width=`${(i+1)/questions.length*100}%`;E("part").textContent=x.part;E("question").textContent=x.q;E("options").innerHTML=x.o.map((v,j)=>`<label class="opt"><input type="radio" name="ans" value="${j}"><span>${String.fromCharCode(97+j)}) ${v}</span></label>`).join("");E("feedback").className="fb";E("feedback").textContent="";E("check").style.display="inline-block";E("next").style.display="none"}E("check").onclick=()=>{if(locked)return;const s=document.querySelector('input[name="ans"]:checked');if(!s){E("feedback").className="fb bad";E("feedback").textContent="Please choose an answer first.";return}locked=true;document.querySelectorAll('input[name="ans"]').forEach(x=>x.disabled=true);const chosen=Number(s.value),right=chosen===questions[i].a;if(right)points++;else wrong.push(i);E("feedback").className="fb "+(right?"ok":"bad");E("feedback").textContent=right?"✓ Correct!":"✗ Incorrect. Correct answer: "+questions[i].o[questions[i].a];E("score").textContent=`Score: ${points} / ${questions.length}`;E("check").style.display="none";E("next").style.display="inline-block";E("next").textContent=i===questions.length-1?"Show Final Result":"Next Question →"};E("next").onclick=()=>{if(i<questions.length-1){i++;render();scrollTo(0,0)}else{E("quiz").style.display="none";E("result").style.display="block";const pct=Math.round(points/questions.length*100);E("final").textContent=`${points} / ${questions.length} — ${pct}%`;E("message").textContent=pct>=90?"Excellent performance!":pct>=75?"Very good. Review the missed rules.":pct>=60?"Good. More review will strengthen your reading.":"Review the rules carefully and try again.";E("review").innerHTML=wrong.length?`<strong>Questions to review:</strong><p>${wrong.map(n=>n+1).join(", ")}</p>`:"<strong>Excellent — no incorrect answers.</strong>";scrollTo(0,0)}};E("restart").onclick=()=>{i=0;points=0;wrong=[];E("result").style.display="none";E("quiz").style.display="block";render();scrollTo(0,0)};render();</script></body></html>
