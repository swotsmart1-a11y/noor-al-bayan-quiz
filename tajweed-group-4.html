<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>GROUP 4</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.w{max-width:800px;margin:auto;padding:14px}header{text-align:center;padding:18px}h1{margin:0;font-size:31px}.c{background:#fff;border:1px solid #d0d5dd;border-radius:16px;padding:20px}.m{display:flex;justify-content:space-between;color:#667085}.bar{height:8px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:14px 0 22px}#fill{height:100%;background:#2563eb}#q{font-size:20px;line-height:1.65}.op{display:flex;gap:11px;border:1px solid #d0d5dd;border-radius:11px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.55}.op input{width:20px;height:20px}.fb{display:none;margin-top:15px;padding:12px;border-radius:10px;font-weight:bold}.ok{display:block;background:#ecfdf3;color:#15803d}.bad{display:block;background:#fef3f2;color:#b42318}.a{display:flex;gap:10px;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}.p{background:#2563eb;color:white}.s{background:#eef2f6}.r{display:none;text-align:center}.big{font-size:42px;font-weight:bold}.rev{text-align:left;border-top:1px solid #ddd;margin-top:18px;padding-top:15px}@media(max-width:500px){.w{padding:10px}.c{padding:15px}.a{flex-wrap:wrap}.a button{width:100%}}</style></head><body><div class=w><header><h1>GROUP 4</h1></header><section id=quiz class=c><div class=m><span id=ct></span><span id=sc></span></div><div class=bar><div id=fill></div></div><h2 id=q></h2><div id=ops></div><div id=fb class=fb></div><div class=a><button id=ck class=p>Check Answer</button><button id=nx class=s style="display:none">Next Question →</button></div></section><section id=res class="c r"><h2>Assessment Completed</h2><div id=fin class=big></div><p id=msg></p><div id=rev class=rev></div><button id=rs class=p>Restart Quiz</button></section></div><script>const Q=[{"q": "Which order best represents Ghunnah from strongest/fullest toward weaker states?", "o": ["Mushaddad → Mudgham → Mukhfa → Saakin with Izhar → vowelled Noon/Meem", "Izhar → Mushaddad → vowelled → Mukhfa → Mudgham", "Vowelled → Izhar → Mukhfa → Mudgham → Mushaddad", "All are equal"], "a": 0}, {"q": "In يَا أَيُّهَا, which Madd occurs between the two words?", "o": ["Madd Munfasil", "Madd Muttasil", "Madd Lazim", "Madd Iwad"], "a": 0}, {"q": "Which letters have Tawassut (Bayniyyah)?", "o": ["ق ط ب ج د", "ل ن ع م ر — لن عمر", "ص ض ط ظ", "ء ه ع ح غ خ"], "a": 1}, {"q": "In جَاءَ, which Madd occurs?", "o": ["Madd Munfasil", "Madd Badal", "Madd Muttasil", "Madd Arid lis-Sukun"], "a": 2}, {"q": "In سَمِيعٌ بَصِيرٌ, what rule applies to Tanween before ب?", "o": ["Ikhfa", "Izhar", "Idgham", "Iqlab"], "a": 3}, {"q": "When pronouncing بْ, the sound is strongly blocked before release. Which characteristic is illustrated?", "o": ["Rikhwah", "Hams", "Leen", "Shiddah"], "a": 3}, {"q": "Where are غ and خ articulated?", "o": ["Deepest throat", "Nearest part of throat to the mouth", "Lips", "Tongue tip"], "a": 1}, {"q": "In مَنْ آمَنَ, what rule applies to نْ before ء?", "o": ["Ikhfa", "Iqlab", "Idgham", "Izhar Halqi"], "a": 3}, {"q": "In إِنَّ, Noon is Mushaddad. Which Ghunnah state is this?", "o": ["Izhar state", "Weakest vowelled state", "Strongest/fullest Ghunnah state", "No Ghunnah"], "a": 2}, {"q": "Where are ق and ك articulated?", "o": ["Lips", "Middle throat", "Tongue tip", "Back of tongue; ق is farther back/higher than ك"], "a": 3}, {"q": "At the beginning of آمَنُوا, which Madd is found?", "o": ["Madd Muttasil", "Madd Leen", "Madd Badal", "Madd Lazim"], "a": 2}, {"q": "In إِنَّهُ كَانَ, the pronoun Haa connection, when its conditions are met, is:", "o": ["Madd Silah Kubra", "Madd Silah Sughra", "Madd Lazim", "Madd Iwad"], "a": 1}, {"q": "When pronouncing د, breath does not flow as it does with ت. Which characteristic is illustrated?", "o": ["Hams", "Jahr", "Rikhwah", "Istifal"], "a": 1}, {"q": "In قَدْ تَبَيَّنَ, why is this an example of Mutajanisayn?", "o": ["They are identical", "They are Madd letters", "د and ت share an articulation point but differ in characteristics", "They are far apart"], "a": 2}, {"q": "Where are ج ش ي (non-Madd Ya) articulated?", "o": ["Deepest throat", "Middle of tongue with corresponding palate", "Two lips", "Tongue tip with upper incisors"], "a": 1}, {"q": "In قَالَ اللَّهُ, how is the Lam in اللَّه read?", "o": ["Light: preceded by Fatha", "Heavy: preceded by Fatha", "Light: every Lam is light", "Heavy due to Qalqalah"], "a": 1}, {"q": "Which letters trigger the two special non-Izhar rules of Meem Saakinah?", "o": ["ب for Ikhfa Shafawi and م for Idgham Shafawi", "ن and م", "ل and ر", "ء and ه"], "a": 0}, {"q": "In هُمْ فِيهَا, what rule applies to مْ before ف?", "o": ["Izhar Shafawi", "Ikhfa Shafawi", "Idgham Shafawi", "Iqlab"], "a": 0}, {"q": "In مِنْ بَعْدِ, what rule applies to نْ before ب?", "o": ["Ikhfa", "Izhar Halqi", "Idgham with Ghunnah", "Iqlab"], "a": 3}, {"q": "Which letter has both Isti'la and Itbaq?", "o": ["ق", "غ", "ص", "خ"], "a": 2}, {"q": "In رَبِّ, how is ر read?", "o": ["Light", "Light because Mushaddad", "With Ikhfa", "Heavy (Tafkheem): Ra has Fatha"], "a": 3}, {"q": "In مِنْ رَبِّهِمْ, what rule applies to نْ before ر?", "o": ["Idgham with Ghunnah", "Idgham without Ghunnah", "Ikhfa", "Iqlab"], "a": 1}, {"q": "Which phrase gathers the Shiddah letters?", "o": ["فحثه شخص سكت", "أجد قط بكت", "خص ضغط قظ", "لن عمر"], "a": 1}, {"q": "When stopping on الرَّحِيمِ, which Madd may arise?", "o": ["Madd Badal", "Madd Muttasil", "Madd Arid lis-Sukun", "Madd Silah Kubra"], "a": 2}, {"q": "In رُسُلٌ, how is the first ر read?", "o": ["Heavy (Tafkheem): Ra has Damma", "Light", "Light because initial", "With Qalqalah"], "a": 0}, {"q": "Which set contains the Ikhfa letters?", "o": ["ء ه ع ح غ خ", "ي ر م ل و ن", "ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك", "ق ط ب ج د"], "a": 2}, {"q": "In رِزْقًا, how is the first ر read?", "o": ["Light (Tarqeeq): Ra has Kasra", "Heavy because ز follows", "Heavy: Ra always heavy", "With Ghunnah"], "a": 0}, {"q": "Which phrase gathers the Hams letters?", "o": ["فحثه شخص سكت", "أجد قط بكت", "خص ضغط قظ", "قطب جد"], "a": 0}, {"q": "In الضَّالِّينَ, which Madd occurs before the permanent Shaddah?", "o": ["Madd Lazim Kalimi Muthaqqal", "Madd Tabii", "Madd Munfasil", "Madd Iwad"], "a": 0}, {"q": "In يَجْعَلُونَ, جْ is Saakin in the middle. What Qalqalah degree is this?", "o": ["Qalqalah Kubra", "Qalqalah Akbar", "No Qalqalah", "Qalqalah Sughra"], "a": 3}, {"q": "In بِهِ أَحَدًا, the pronoun Haa followed by Hamzah, when Silah conditions are met, gives:", "o": ["Madd Silah Sughra", "Madd Tabii", "Madd Leen", "Madd Silah Kubra"], "a": 3}, {"q": "In بِسْمِ اللَّهِ, how is the Lam in اللَّه read?", "o": ["Heavy because of Shaddah", "Heavy: Allah always heavy", "Light: preceded by Kasra", "Light due to Qalqalah"], "a": 2}, {"q": "When stopping on عَلِيمًا, what type and length normally occur?", "o": ["Madd Lazim — 6 counts", "Madd Iwad — 2 counts", "Madd Muttasil — 4 or 5", "Madd Arid — 2, 4, or 6"], "a": 1}, {"q": "In قُلْ رَبِّ, why is this an example of Mutaqaribayn?", "o": ["They are identical letters", "ل and ر are close in articulation/characteristics; first is Saakin", "They are Madd letters", "They are far apart"], "a": 1}, {"q": "Which Isti'la letter does NOT have Itbaq?", "o": ["ص", "ض", "ط", "ق"], "a": 3}, {"q": "Which set contains the Idgham-with-Ghunnah letters?", "o": ["ل ر", "ي ن م و", "ء ه ع ح غ خ", "ق ط ب ج د"], "a": 1}, {"q": "In لَكُمْ مَا, what rule applies to مْ before م?", "o": ["Ikhfa Shafawi", "Izhar Shafawi", "Idgham Shafawi", "Iqlab"], "a": 2}, {"q": "Where are ع and ح articulated?", "o": ["Deepest throat", "Lips", "Side of tongue", "Middle part of the throat"], "a": 3}, {"q": "Which description correctly gives the articulation of ف and ب?", "o": ["ف: lower lip with upper incisors; ب: between both lips", "Both from throat", "Both from middle tongue", "Both from nasal passage"], "a": 0}, {"q": "In تَرْمِيهِمْ بِحِجَارَةٍ, what rule applies to مْ before ب?", "o": ["Izhar Shafawi", "Idgham Shafawi", "Ikhfa Shafawi", "Iqlab"], "a": 2}, {"q": "When stopping on الْفَلَقْ, what Qalqalah degree is heard on final قْ?", "o": ["Qalqalah Kubra", "Qalqalah Sughra", "Qalqalah Akbar", "Ikhfa"], "a": 0}, {"q": "Where is ض articulated?", "o": ["Two lips", "Middle throat", "Side of tongue against upper molars", "Tongue tip with lower incisors"], "a": 2}, {"q": "In مَنْ يَعْمَلْ, compared with a clear Noon in Izhar, the Ghunnah is:", "o": ["Stronger/more complete because of Idgham with Ghunnah", "Absent", "Weaker than a vowelled Noon", "Qalqalah"], "a": 0}, {"q": "Which group contains all seven Isti'la letters?", "o": ["ء ه ع ح غ خ", "ق ط ب ج د", "خ ص ض غ ط ق ظ — خص ضغط قظ", "ف ح ث ه ش خ ص س ك ت"], "a": 2}, {"q": "In س, the sound continues to flow. Which characteristic does this illustrate?", "o": ["Shiddah", "Rikhwah", "Qalqalah", "Isti'la"], "a": 1}, {"q": "Which set correctly includes key characteristics of ج?", "o": ["Hams, Rikhwah, Isti'la, Itbaq", "Hams, Shiddah, Safir, Leen", "Jahr, Shiddah, Istifal, Infitah, Ismat, Qalqalah", "Jahr, Rikhwah, Isti'la, Itbaq"], "a": 2}, {"q": "In مَنْ يَعْمَلْ, what rule applies to نْ before ي?", "o": ["Ikhfa", "Idgham with Ghunnah", "Iqlab", "Izhar Halqi"], "a": 1}, {"q": "Mithlayn means two identical letters meet, first Saakin and second vowelled. Which example matches?", "o": ["قُلْ رَبِّ", "قَدْ تَبَيَّنَ", "اضْرِبْ بِعَصَاكَ — بْ followed by ب", "مِنْ شَرِّ"], "a": 2}, {"q": "In وَالطُّورِ, which description best fits ط?", "o": ["It is an Istifal letter and always light", "It is a Hams letter only", "It is a throat letter", "It is an Isti'la and Itbaq letter, so it is pronounced heavy"], "a": 3}, {"q": "Which set contains the six Izhar Halqi letters?", "o": ["ء ه ع ح غ خ", "ي ر م ل و ن", "ق ط ب ج د", "خ ص ض غ ط ق ظ"], "a": 0}, {"q": "When stopping on خَوْفْ, the Waw Saakinah preceded by Fatha can form:", "o": ["Madd Leen", "Madd Badal", "Madd Muttasil", "Madd Silah"], "a": 0}, {"q": "In غَفُورٌ رَحِيمٌ, what rule applies to Tanween before ر?", "o": ["Idgham without Ghunnah", "Idgham with Ghunnah", "Ikhfa", "Izhar"], "a": 0}, {"q": "Where are ء and ه articulated?", "o": ["Middle tongue", "Lips", "Tongue tip", "Deepest part of the throat"], "a": 3}, {"q": "When pronouncing كْ in يَكْتُبُ, breath can be felt flowing. Which characteristic is illustrated?", "o": ["Jahr", "Qalqalah", "Itbaq", "Hams"], "a": 3}, {"q": "In صِرَاطَ, which characteristic makes ص inherently elevated/heavy?", "o": ["Istifal", "Isti'la", "Hams", "Leen"], "a": 1}, {"q": "Which group contains the four Itbaq letters?", "o": ["خ غ ق ظ", "ص ض ط ظ", "ق ط ب ج", "ص س ز ش"], "a": 1}, {"q": "In مِنْ شَرِّ مَا خَلَقَ, what rule applies to نْ before ش?", "o": ["Izhar Halqi", "Iqlab", "Idgham without Ghunnah", "Ikhfa"], "a": 3}, {"q": "When stopping on الْحَقّ, final ق is Mushaddad and stopped upon. In the three-degree classification, this is:", "o": ["Qalqalah Sughra", "Qalqalah Kubra", "Qalqalah Akbar", "No Qalqalah"], "a": 2}, {"q": "In عَبْدُ اللَّهِ, how is the Lam in اللَّه read?", "o": ["Heavy: preceded by Damma", "Light: preceded by Damma", "Light: Allah always light", "Heavy only because of Shaddah"], "a": 0}, {"q": "In عَلِيمٌ حَكِيمٌ, what rule applies to Tanween before ح?", "o": ["Ikhfa", "Iqlab", "Idgham", "Izhar Halqi"], "a": 3}];let i=0,s=0,l=false,w=[];const E=x=>document.getElementById(x);function sh(){l=false;let x=Q[i];E("ct").textContent=`Question ${i+1} of 60`;E("sc").textContent=`Score: ${s} / 60`;E("fill").style.width=`${(i+1)/60*100}%`;E("q").textContent=x.q;E("ops").innerHTML=x.o.map((v,j)=>`<label class=op><input type=radio name=z value=${j}><span>${String.fromCharCode(65+j)}) ${v}</span></label>`).join("");E("fb").className="fb";E("ck").style.display="inline-block";E("nx").style.display="none"}E("ck").onclick=()=>{if(l)return;let z=document.querySelector('input[name=z]:checked');if(!z){E("fb").className="fb bad";E("fb").textContent="Please choose an answer first.";return}l=true;document.querySelectorAll('input[name=z]').forEach(x=>x.disabled=true);let r=+z.value===Q[i].a;if(r)s++;else w.push(i);E("fb").className="fb "+(r?"ok":"bad");E("fb").textContent=r?"✓ Correct!":"✗ Incorrect. Correct answer: "+String.fromCharCode(65+Q[i].a)+") "+Q[i].o[Q[i].a];E("sc").textContent=`Score: ${s} / 60`;E("ck").style.display="none";E("nx").style.display="inline-block";E("nx").textContent=i===59?"Show Final Result":"Next Question →"};E("nx").onclick=()=>{if(i<59){i++;sh();scrollTo(0,0)}else{E("quiz").style.display="none";E("res").style.display="block";let p=Math.round(s/60*100);E("fin").textContent=`${s} / 60 — ${p}%`;E("msg").textContent=p>=90?"Excellent Tajweed performance.":p>=75?"Very good. Review the missed questions.":p>=60?"Good foundation; more practice is recommended.":"Review the rules and try again.";E("rev").innerHTML=w.length?`<b>Questions to review:</b><p>${w.map(n=>n+1).join(", ")}</p>`:"<b>Excellent — all answers are correct.</b>";scrollTo(0,0)}};E("rs").onclick=()=>{i=s=0;w=[];E("res").style.display="none";E("quiz").style.display="block";sh()};sh();</script></body></html>
