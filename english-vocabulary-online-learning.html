<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Practice</title>
<style>body{font-family:Arial,sans-serif;background:#f3f6fb;color:#182033;margin:0}.w{max-width:800px;margin:auto;padding:20px}.head{text-align:center}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 28px #ccd4e055}.bar{height:9px;background:#e4e9f2;border-radius:9px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;background:#315fd3}.tag{color:#315fd3;font-weight:bold}.count{float:right;color:#667085}.word{text-align:center;font-size:40px;font-weight:bold;margin:30px 0 10px}.ar{text-align:center;direction:rtl;font-size:25px;font-weight:bold}.sent{text-align:center;font-size:21px;line-height:1.6;margin:28px 0}.opts{display:grid;gap:12px}.opt{padding:15px;border:2px solid #d9e1ed;border-radius:12px;background:white;text-align:left;font-size:17px;cursor:pointer}.ok{border-color:#18864b;background:#effbf4}.bad{border-color:#bd2c20;background:#fff1f0}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:25px}.btn{padding:13px 19px;border:0;border-radius:11px;background:#315fd3;color:white;font-weight:bold;cursor:pointer}.sec{background:#edf2ff;color:#315fd3}.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu button{padding:20px;border:1px solid #d9e1ed;border-radius:14px;background:white;text-align:left;cursor:pointer}.menu b{font-size:18px;display:block;margin-bottom:5px}.menu span{color:#667085}.fb{font-weight:bold;margin-top:15px}.result{text-align:center;font-size:50px;font-weight:bold;color:#315fd3}.review{max-width:520px;margin:auto}@media(max-width:550px){.menu{grid-template-columns:1fr}.word{font-size:32px}.nav{flex-direction:column}}</style></head>
<body><div class="w"><div class="head"><h1>Vocabulary Practice</h1><p>Online Learning vs. Traditional Learning</p><p>18 Words & Expressions</p></div><div class="bar"><i id="bar" style="width:0"></i></div><div class="card" id="app"></div></div>
<script>
const V=[{"w": "Flexible", "a": "مرن", "s": "Online learning is more flexible than traditional learning.", "c": "Online learning is more ______ than traditional learning."}, {"w": "Save time and effort", "a": "يوفر الوقت والمجهود", "s": "Online learning can save time and effort.", "c": "Online learning can ______."}, {"w": "Transportation", "a": "المواصلات", "s": "Transportation can take a lot of time every day.", "c": "______ can take a lot of time every day."}, {"w": "Traffic", "a": "الزحام / المرور", "s": "Heavy traffic can make students tired before class.", "c": "Heavy ______ can make students tired before class."}, {"w": "Distraction", "a": "مُشتت / شيء يسبب تشتت", "s": "Mobile phones can be a big distraction during online lessons.", "c": "Mobile phones can be a big ______ during online lessons."}, {"w": "Concentration", "a": "التركيز", "s": "A weak internet connection can affect your concentration.", "c": "A weak internet connection can affect your ______."}, {"w": "Face-to-face communication", "a": "التواصل وجهًا لوجه", "s": "Traditional learning gives students more face-to-face communication.", "c": "Traditional learning gives students more ______."}, {"w": "Self-discipline", "a": "الانضباط الذاتي", "s": "Online learning requires good self-discipline.", "c": "Online learning requires good ______."}, {"w": "Stay focused", "a": "يحافظ على التركيز", "s": "A quiet place can help students stay focused.", "c": "A quiet place can help students ______."}, {"w": "Avoid distractions", "a": "يتجنب المشتتات", "s": "Students should avoid distractions during the lesson.", "c": "Students should ______ during the lesson."}, {"w": "Participate", "a": "يشارك", "s": "Students should participate in discussions and ask questions.", "c": "Students should ______ in discussions and ask questions."}, {"w": "Take notes", "a": "يدون ملاحظات", "s": "I always take notes during online classes.", "c": "I always ______ during online classes."}, {"w": "Review", "a": "يراجع", "s": "You should review the lesson after class.", "c": "You should ______ the lesson after class."}, {"w": "Learn at your own pace", "a": "تتعلم بالسرعة المناسبة لك", "s": "Online courses allow you to learn at your own pace.", "c": "Online courses allow you to ______."}, {"w": "Overcome problems", "a": "يتغلب على المشكلات", "s": "We need to find ways to overcome these problems.", "c": "We need to find ways to ______."}, {"w": "Maximum benefit", "a": "أقصى استفادة", "s": "Good planning helps students get the maximum benefit from online learning.", "c": "Good planning helps students get the ______ from online learning."}, {"w": "Motivated", "a": "متحفز / لديه دافع", "s": "Some students feel more motivated in a classroom.", "c": "Some students feel more ______ in a classroom."}, {"w": "Interaction", "a": "التفاعل", "s": "Traditional learning provides more direct interaction with teachers.", "c": "Traditional learning provides more direct ______ with teachers."}]; let mode="",i=0,score=0,qs=[],wrong=new Set(),locked=false; const app=document.getElementById("app"),bar=document.getElementById("bar");
const sh=a=>[...a].sort(()=>Math.random()-.5); function prog(a,b){bar.style.width=(a/b*100)+"%"}
function home(){prog(0,1);app.innerHTML=`<div style="text-align:center"><span class="tag">START HERE</span><h2>Choose a training stage</h2><p>Learn first, then test yourself.</p></div><div class="menu"><button onclick="learn()"><b>1. Learn</b><span>Study 18 flashcards</span></button><button onclick="meaning()"><b>2. Meaning Quiz</b><span>English → Arabic</span></button><button onclick="sentence()"><b>3. Complete the Sentence</b><span>Use words in context</span></button><button onclick="finalQ()"><b>4. Final Challenge</b><span>Mixed 18-question test</span></button></div>`}
function learn(){mode="learn";i=0;showLearn()} function showLearn(){let x=V[i];prog(i+1,V.length);app.innerHTML=`<span class="tag">STAGE 1 · LEARN</span><span class="count">${i+1} / ${V.length}</span><div class="word">${x.w}</div><div class="ar">${x.a}</div><div class="sent">${x.s}</div><div class="nav"><button class="btn sec" onclick="${i?"i--;showLearn()":"home()"}">${i?"← Previous":"← Menu"}</button><button class="btn" onclick="${i<V.length-1?"i++;showLearn()":"home()"}">${i<V.length-1?"Next →":"Finish ✓"}</button></div>`}
function meaning(){qs=sh(V).map(x=>{let z=sh(V.filter(y=>y.w!=x.w)).slice(0,2).map(y=>y.a);return{p:`What does “${x.w}” mean?`,a:x.a,o:sh([x.a,...z]),w:x.w}});start("STAGE 2 · MEANING QUIZ")}
function sentence(){qs=sh(V).map(x=>{let z=sh(V.filter(y=>y.w!=x.w)).slice(0,2).map(y=>y.w);return{p:x.c,a:x.w,o:sh([x.w,...z]),w:x.w}});start("STAGE 3 · COMPLETE THE SENTENCE")}
function finalQ(){qs=sh(V).map((x,n)=>n%2?{p:x.c,a:x.w,o:sh([x.w,...sh(V.filter(y=>y.w!=x.w)).slice(0,2).map(y=>y.w)]),w:x.w}:{p:`“${x.a}” means:`,a:x.w,o:sh([x.w,...sh(V.filter(y=>y.w!=x.w)).slice(0,2).map(y=>y.w)]),w:x.w});start("STAGE 4 · FINAL CHALLENGE")}
function start(m){mode=m;i=score=0;wrong=new Set();showQ()} function showQ(){locked=false;let q=qs[i];prog(i+1,qs.length);app.innerHTML=`<span class="tag">${mode}</span><span class="count">${i+1} / ${qs.length}</span><div class="sent" style="font-size:24px;font-weight:bold">${q.p}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join("")}</div><div class="fb" id="fb"></div><div class="nav"><button class="btn sec" onclick="home()">← Menu</button><button class="btn" id="next" style="display:none" onclick="next()">Next →</button></div>`}
function pick(k){if(locked)return;locked=true;let q=qs[i],bs=[...document.querySelectorAll(".opt")],v=q.o[k];bs.forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.a)b.classList.add("ok")});let f=document.getElementById("fb");if(v==q.a){score++;f.innerHTML="Correct! ✓";f.style.color="#18864b"}else{bs[k].classList.add("bad");wrong.add(q.w);f.innerHTML=`Incorrect. Correct answer: <b>${q.a}</b>`;f.style.color="#bd2c20"}document.getElementById("next").style.display="block"}
function next(){if(++i<qs.length)showQ();else result()} function result(){prog(1,1);let p=Math.round(score/qs.length*100),r=[...wrong];app.innerHTML=`<div style="text-align:center"><span class="tag">COMPLETED</span><h2>Your Result</h2><div class="result">${score} / ${qs.length}</div><h2>${p}%</h2><p>${p>=90?"Excellent work!":p>=75?"Very good!":p>=60?"Good effort — review the missed words.":"Keep practicing — review and try again."}</p></div>${r.length?`<div class="review"><h3>Words to Review</h3><ul>${r.map(w=>`<li><b>${w}</b> — ${V.find(x=>x.w==w).a}</li>`).join("")}</ul></div>`:"<p style='text-align:center'><b>No words to review. Great job!</b></p>"}<div class="nav"><button class="btn sec" onclick="home()">← Main Menu</button><button class="btn" onclick="mode.includes('MEANING')?meaning():mode.includes('SENTENCE')?sentence():finalQ()">Try Again</button></div>`} home();
</script></body></html>
