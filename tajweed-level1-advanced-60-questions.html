<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Tajweed 60 Questions</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.w{max-width:800px;margin:auto;padding:14px}header{text-align:center;padding:12px}h1{margin:0 0 8px}.c{background:white;border:1px solid #d0d5dd;border-radius:16px;padding:20px}.m{display:flex;justify-content:space-between;color:#667085}.bar{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:14px 0 18px}#fill{height:100%;background:#2563eb}.badge{display:inline-block;background:#eef4ff;color:#175cd3;padding:5px 9px;border-radius:20px;font-weight:bold}.topic{margin:8px 0;color:#475467;font-weight:bold}#q{font-size:19px;line-height:1.55}.opt{display:flex;gap:11px;border:1px solid #d0d5dd;border-radius:11px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.45}.opt input{width:20px;height:20px}.fb{display:none;padding:12px;border-radius:10px;margin-top:15px;font-weight:bold}.ok{display:block;background:#ecfdf3;color:#15803d}.bad{display:block;background:#fef3f2;color:#b42318}.act{display:flex;gap:10px;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;font-size:16px;cursor:pointer}.p{background:#2563eb;color:white}.s{background:#eef2f6}.res{display:none;text-align:center}.big{font-size:40px;font-weight:bold;margin:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border:1px solid #d0d5dd;border-radius:12px;padding:14px}.review{text-align:left;border-top:1px solid #ddd;margin-top:15px;padding-top:15px}@media(max-width:500px){.w{padding:10px}.c{padding:15px}.act{flex-wrap:wrap}.act button{width:100%}.grid{grid-template-columns:1fr}}</style></head>
<body><div class=w><header><h1>Tajweed Assessment — 60 Questions</h1><div>40 Level 1 + 20 Advanced</div><div>اختبار التجويد: 40 مستوى أول + 20 متقدم</div></header>
<section id=quiz class=c><div class=m><span id=count></span><span id=score></span></div><div class=bar><div id=fill></div></div><div id=level class=badge></div><div id=topic class=topic></div><h2 id=q></h2><div id=opts></div><div id=fb class=fb></div><div class=act><button id=check class=p>Check Answer</button><button id=next class=s style="display:none">Next Question →</button></div></section>
<section id=result class="c res"><h2>Assessment Completed — تم الانتهاء</h2><div id=final class=big></div><div class=grid><div class=stat><b>Level 1</b><div id=bsc></div></div><div class=stat><b>Advanced</b><div id=asc></div></div></div><p id=msg></p><div id=review class=review></div><button id=restart class=p>Restart Quiz</button></section></div>
<script>const Q=[{"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "How many main rules are there for Noon Saakinah and Tanween?", "o": ["Four", "Two", "Three", "Five"], "a": 0}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "Which rule applies before the throat letters ء ه ع ح غ خ?", "o": ["Ikhfa", "Iqlab", "Idgham", "Izhar Halqi"], "a": 3}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "Which rule applies when Noon Saakinah or Tanween is followed by ب?", "o": ["Izhar", "Ikhfa Shafawi", "Idgham without Ghunnah", "Iqlab"], "a": 3}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "Which group contains all six Idgham letters?", "o": ["ي ر م ل و ن (يرملون)", "ق ط ب ج د", "ء ه ع ح غ خ", "ف ح ث ه ش خ"], "a": 0}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "Which letters cause Idgham with Ghunnah?", "o": ["ل ر", "ء ه ع ح غ خ", "ي ن م و (ينمو)", "ق ط ب ج د"], "a": 2}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "Which letters cause Idgham without Ghunnah?", "o": ["ي and و", "م and ن", "ل and ر", "ب and م"], "a": 2}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "What best describes Ikhfa of Noon Saakinah/Tanween?", "o": ["Complete clear pronunciation", "Changing Noon into Meem", "Concealment between Izhar and Idgham with Ghunnah", "Complete deletion with no Ghunnah"], "a": 2}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "How many Ikhfa letters are there for Noon Saakinah/Tanween?", "o": ["6", "2", "4", "15"], "a": 3}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "What rule applies in مِنْ بَعْدِ?", "o": ["Iqlab", "Izhar", "Idgham with Ghunnah", "Ikhfa"], "a": 0}, {"level": "Level 1", "topic": "Noon Saakinah & Tanween", "q": "What rule applies to Noon Saakinah before ع in مِنْ عِلْمٍ?", "o": ["Ikhfa", "Iqlab", "Idgham", "Izhar Halqi"], "a": 3}, {"level": "Level 1", "topic": "Meem Saakinah", "q": "How many main rules are there for Meem Saakinah?", "o": ["Two", "Four", "Three", "Six"], "a": 2}, {"level": "Level 1", "topic": "Meem Saakinah", "q": "What is the rule when Meem Saakinah is followed by ب?", "o": ["Ikhfa Shafawi", "Idgham Shafawi", "Izhar Shafawi", "Iqlab"], "a": 0}, {"level": "Level 1", "topic": "Meem Saakinah", "q": "What is the rule when Meem Saakinah is followed by م?", "o": ["Ikhfa Shafawi", "Izhar Halqi", "Iqlab", "Idgham Shafawi"], "a": 3}, {"level": "Level 1", "topic": "Meem Saakinah", "q": "What is the rule when Meem Saakinah is followed by a letter other than ب or م?", "o": ["Ikhfa Shafawi", "Izhar Shafawi", "Idgham Shafawi", "Idgham without Ghunnah"], "a": 1}, {"level": "Level 1", "topic": "Meem Saakinah", "q": "Why is it called Shafawi?", "o": ["Because Meem is from the throat", "Because Meem is articulated from the lips", "Because every Meem has Madd", "Because the tongue tip produces Meem"], "a": 1}, {"level": "Level 1", "topic": "Ghunnah", "q": "What is Ghunnah?", "o": ["A bouncing tongue sound", "A six-count vowel", "A nasal sound resonating through the nasal passage", "A complete stop of airflow"], "a": 2}, {"level": "Level 1", "topic": "Ghunnah", "q": "Which two letters inherently have the Ghunnah characteristic?", "o": ["ن and م", "ل and ر", "ق and ط", "و and ي"], "a": 0}, {"level": "Level 1", "topic": "Ghunnah", "q": "How long is the Ghunnah of Noon or Meem Mushaddadah normally held?", "o": ["1 count", "2 counts", "4 counts", "6 counts"], "a": 1}, {"level": "Level 1", "topic": "Ghunnah", "q": "Which example contains Noon Mushaddadah requiring Ghunnah?", "o": ["إِنَّ", "مِنْ", "قُلْ", "قَدْ"], "a": 0}, {"level": "Level 1", "topic": "Ghunnah", "q": "Which example contains Meem Mushaddadah requiring Ghunnah?", "o": ["هُمْ", "لَمْ", "ثُمَّ", "قُمْ"], "a": 2}, {"level": "Level 1", "topic": "Qalqalah", "q": "Which are the Qalqalah letters?", "o": ["ء ه ع ح غ خ", "ق ط ب ج د (قطب جد)", "ي ن م و", "خ ص ض غ ط ق ظ"], "a": 1}, {"level": "Level 1", "topic": "Qalqalah", "q": "When is Qalqalah heard?", "o": ["Whenever any letter has Fatha", "Only on Madd letters", "Only when Noon has Shaddah", "When a Qalqalah letter is Saakin"], "a": 3}, {"level": "Level 1", "topic": "Qalqalah", "q": "What best describes Qalqalah?", "o": ["A nasal sound", "A controlled bounce in a Saakin Qalqalah letter", "A long vowel", "Complete assimilation"], "a": 1}, {"level": "Level 1", "topic": "Qalqalah", "q": "When stopping on أَحَدْ, which letter has Qalqalah?", "o": ["ح", "أ", "None", "د"], "a": 3}, {"level": "Level 1", "topic": "Qalqalah", "q": "In يَجْعَلُونَ, which letter has Qalqalah because it is Saakin?", "o": ["عَ", "لُ", "نَ", "جْ"], "a": 3}, {"level": "Level 1", "topic": "Madd", "q": "How long is Madd Tabii?", "o": ["1 count", "4 counts", "2 counts", "6 counts"], "a": 2}, {"level": "Level 1", "topic": "Madd", "q": "Which are the three Madd letters?", "o": ["ء ، ه ، ع", "ق ، ط ، ب", "ا ، و ، ي", "ن ، م ، ل"], "a": 2}, {"level": "Level 1", "topic": "Madd", "q": "For Alif to be a Madd letter, the letter before it must have:", "o": ["Fatha", "Kasra", "Damma", "Sukun"], "a": 0}, {"level": "Level 1", "topic": "Madd", "q": "For Waw Saakinah to be a Madd letter, the letter before it must have:", "o": ["Damma", "Fatha", "Kasra", "Sukun"], "a": 0}, {"level": "Level 1", "topic": "Madd", "q": "For Ya Saakinah to be a Madd letter, the letter before it must have:", "o": ["Fatha", "Damma", "Kasra", "Shaddah"], "a": 2}, {"level": "Level 1", "topic": "Madd", "q": "What type of Madd is found in قَالَ?", "o": ["Madd Lazim", "Madd Tabii with Alif", "Madd Muttasil", "Madd Iwad"], "a": 1}, {"level": "Level 1", "topic": "Madd", "q": "Which Madd letter produces the long sound in يَقُولُ?", "o": ["Waw Maddiyyah", "Alif Maddiyyah", "Ya Maddiyyah", "Hamzah"], "a": 0}, {"level": "Level 1", "topic": "Lam Rules", "q": "In الشَّمْسِ, what happens to the Lam of ال?", "o": ["It is pronounced clearly", "It changes into Meem", "It becomes a Madd letter", "It assimilates into the sun letter and is not pronounced separately"], "a": 3}, {"level": "Level 1", "topic": "Lam Rules", "q": "In الْقَمَرِ, how is the Lam of ال pronounced?", "o": ["Clearly, because ق is a moon letter", "It assimilates into ق", "It is omitted", "It changes into ر"], "a": 0}, {"level": "Level 1", "topic": "Lam Rules", "q": "What sign normally appears on the sun letter after ال?", "o": ["Shaddah", "Sukun", "Tanween", "Madd sign"], "a": 0}, {"level": "Level 1", "topic": "Waqf", "q": "When stopping on a normally vowelled final consonant, what generally happens?", "o": ["The final vowel is doubled", "It becomes Tanween", "The final letter is stopped with Sukun", "A Hamzah is added"], "a": 2}, {"level": "Level 1", "topic": "Waqf", "q": "When stopping on a word ending in Taa Marbutah (ة), how is it generally pronounced?", "o": ["As an open Taa with Fatha", "As Madd Alif", "As a Saakin Haa sound", "It is completely deleted"], "a": 2}, {"level": "Level 1", "topic": "Waqf", "q": "When stopping on عَلِيمًا, what normally happens to Tanween Fath?", "o": ["It becomes a 2-count Alif sound (Madd Iwad)", "It becomes Tanween Kasr", "It remains -an", "It becomes six-count Ghunnah"], "a": 0}, {"level": "Level 1", "topic": "Hamzat Al-Wasl", "q": "What is the key difference between Hamzat Al-Wasl and Hamzat Al-Qat'?", "o": ["Both are always dropped", "Qat' is only pronounced when stopping", "There is no difference", "Wasl is pronounced when starting and normally drops in connection; Qat' is always pronounced"], "a": 3}, {"level": "Level 1", "topic": "Hamzat Al-Wasl", "q": "When beginning اُدْخُلُوا, Hamzat Al-Wasl is pronounced with:", "o": ["Fatha", "Kasra", "No vowel", "Damma"], "a": 3}, {"level": "Advanced", "topic": "Advanced Madd", "q": "Madd Muttasil occurs when:", "o": ["A Madd letter is followed by Hamzah in the same word", "Hamzah begins the next word", "A Madd letter is followed by any vowel", "Hamzah precedes the Madd letter"], "a": 0}, {"level": "Advanced", "topic": "Advanced Madd", "q": "In common Hafs 'an Asim teaching through al-Shatibiyyah, Madd Muttasil is read:", "o": ["2 counts only", "6 counts only", "4 or 5 counts", "1 count"], "a": 2}, {"level": "Advanced", "topic": "Advanced Madd", "q": "Madd Munfasil occurs when:", "o": ["Madd and Hamzah are in the same word", "A Madd letter ends one word and Hamzah begins the next", "Madd is followed by permanent Sukun", "A Qalqalah letter is followed by Hamzah"], "a": 1}, {"level": "Advanced", "topic": "Advanced Madd", "q": "What is the standard length of Madd Lazim?", "o": ["2 counts", "6 counts", "4 counts", "4 or 5 counts"], "a": 1}, {"level": "Advanced", "topic": "Advanced Madd", "q": "What causes Madd Lazim?", "o": ["A temporary Sukun caused only by stopping", "Tanween Fath", "A Madd letter followed by original/permanent Sukun, including Shaddah", "Any Hamzah in the next word"], "a": 2}, {"level": "Advanced", "topic": "Advanced Madd", "q": "When stopping, Madd Arid lis-Sukun may normally be read:", "o": ["2 only", "2, 4, or 6 counts", "4 or 5 only", "6 only"], "a": 1}, {"level": "Advanced", "topic": "Noon Saakinah", "q": "What rule applies in مِنْ رَبِّهِمْ?", "o": ["Idgham without Ghunnah", "Idgham with Ghunnah", "Iqlab", "Izhar Halqi"], "a": 0}, {"level": "Advanced", "topic": "Noon Saakinah", "q": "What rule applies in مَنْ يَعْمَلْ?", "o": ["Ikhfa", "Idgham with Ghunnah", "Iqlab", "Izhar Halqi"], "a": 1}, {"level": "Advanced", "topic": "Noon Saakinah", "q": "What rule applies in أَنْبِئْهُمْ?", "o": ["Ikhfa", "Iqlab", "Izhar", "Idgham without Ghunnah"], "a": 1}, {"level": "Advanced", "topic": "Tanween", "q": "What rule applies to Tanween before خ in عَلِيمٌ خَبِيرٌ?", "o": ["Ikhfa", "Iqlab", "Idgham with Ghunnah", "Izhar Halqi"], "a": 3}, {"level": "Advanced", "topic": "Noon Saakinah", "q": "What rule applies in مِنْ شَرِّ?", "o": ["Ikhfa", "Izhar Halqi", "Iqlab", "Idgham without Ghunnah"], "a": 0}, {"level": "Advanced", "topic": "Waqf & Madd", "q": "When stopping on الرَّحِيمِ, the temporary Sukun may create:", "o": ["Madd Badal", "Madd Lazim Harfi", "Madd Arid lis-Sukun", "Madd Silah"], "a": 2}, {"level": "Advanced", "topic": "Waqf & Madd", "q": "Which ending is an exception to the usual Madd Iwad treatment because it ends in Taa Marbutah?", "o": ["عَلِيمًا", "حَكِيمًا", "سَمِيعًا", "رَحْمَةً"], "a": 3}, {"level": "Advanced", "topic": "Advanced Madd", "q": "What is Madd Badal?", "o": ["A Madd letter followed by Hamzah in the next word", "A Hamzah followed by a Madd letter in the same word", "A Madd letter followed by permanent Sukun", "Any Madd caused by stopping"], "a": 1}, {"level": "Advanced", "topic": "Lam of Allah", "q": "How is the Lam in اللَّه generally read when immediately preceded by Kasra?", "o": ["Heavy (Tafkhim)", "Light (Tarqiq)", "With Qalqalah", "With Ikhfa"], "a": 1}, {"level": "Advanced", "topic": "Lam of Allah", "q": "How is the Lam in اللَّه generally read when immediately preceded by Fatha or Damma?", "o": ["Light (Tarqiq)", "Heavy (Tafkhim)", "Silent", "With Iqlab"], "a": 1}, {"level": "Advanced", "topic": "Rules of Ra", "q": "In the basic rule, a Ra carrying Kasra (رِ) is generally:", "o": ["Heavy (Tafkhim)", "Light (Tarqiq)", "Merged", "Read with Qalqalah"], "a": 1}, {"level": "Advanced", "topic": "Rules of Ra", "q": "In the basic rule, a Ra carrying Fatha or Damma is generally:", "o": ["Light (Tarqiq)", "Always silent", "Heavy (Tafkhim)", "Always nasalized"], "a": 2}, {"level": "Advanced", "topic": "Hamzat Al-Wasl", "q": "In قُلِ ادْعُوا, why is Lam given a temporary Kasra in connected reading?", "o": ["To create Madd Muttasil", "Every Lam must have Kasra", "To produce Qalqalah", "To avoid two consecutive Saakin letters after Hamzat Al-Wasl drops"], "a": 3}, {"level": "Advanced", "topic": "Qalqalah", "q": "When stopping on الْفَلَقْ, the stronger Qalqalah on final قْ is commonly called:", "o": ["Qalqalah Sughra", "Ikhfa Shafawi", "Madd Lazim", "Qalqalah Kubra"], "a": 3}];let i=0,p=0,b=0,a=0,lock=false,w=[];const E=x=>document.getElementById(x);
function show(){lock=false;let x=Q[i];E("count").textContent=`Question ${i+1} of 60`;E("score").textContent=`Score: ${p} / 60`;E("fill").style.width=`${(i+1)/60*100}%`;E("level").textContent=x.level;E("topic").textContent=x.topic;E("q").textContent=x.q;E("opts").innerHTML=x.o.map((v,j)=>`<label class=opt><input type=radio name=ans value=${j}><span>${String.fromCharCode(65+j)}) ${v}</span></label>`).join("");E("fb").className="fb";E("fb").textContent="";E("check").style.display="inline-block";E("next").style.display="none"}
E("check").onclick=()=>{if(lock)return;let s=document.querySelector('input[name=ans]:checked');if(!s){E("fb").className="fb bad";E("fb").textContent="Please choose an answer first.";return}lock=true;document.querySelectorAll('input[name=ans]').forEach(z=>z.disabled=true);let r=+s.value===Q[i].a;if(r){p++;Q[i].level==="Level 1"?b++:a++}else w.push(i);E("fb").className="fb "+(r?"ok":"bad");E("fb").textContent=r?"✓ Correct!":"✗ Incorrect. Correct answer: "+String.fromCharCode(65+Q[i].a)+") "+Q[i].o[Q[i].a];E("score").textContent=`Score: ${p} / 60`;E("check").style.display="none";E("next").style.display="inline-block";E("next").textContent=i===59?"Show Final Result":"Next Question →"};
E("next").onclick=()=>{if(i<59){i++;show();scrollTo(0,0)}else{E("quiz").style.display="none";E("result").style.display="block";let pc=Math.round(p/60*100);E("final").textContent=`${p} / 60 — ${pc}%`;E("bsc").textContent=`${b} / 40`;E("asc").textContent=`${a} / 20`;E("msg").textContent=pc>=90?"Excellent Tajweed performance.":pc>=75?"Very good. Review the missed rules.":pc>=60?"Good foundation; targeted review is recommended.":"Review the core rules and try again.";E("review").innerHTML=w.length?`<b>Questions to review:</b><p>${w.map(n=>n+1).join(", ")}</p>`:"<b>Excellent — all answers are correct.</b>";scrollTo(0,0)}};
E("restart").onclick=()=>{i=p=b=a=0;w=[];E("result").style.display="none";E("quiz").style.display="block";show();scrollTo(0,0)};show();</script></body></html>
