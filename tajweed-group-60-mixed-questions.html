<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GROUP NO. ...........</title><style>

<script>const Q=[{"q": "Which word has Tanween Damm?", "o": ["كِتَابًا", "كِتَابٍ", "كِتَابٌ", "الْكِتَابُ"], "a": 2}, {"q": "How many Ikhfa letters are there?", "o": ["2", "6", "4", "15"], "a": 3}, {"q": "Kasra normally gives which short sound?", "o": ["Short 'a'", "Short 'i'", "Short 'u'", "Long 'ee'"], "a": 1}, {"q": "Idgham Mutaqaribayn occurs when:", "o": ["Two identical letters meet", "Two letters must have exactly the same articulation point", "Two distant letters meet", "Two letters are close in articulation point and/or characteristics"], "a": 3}, {"q": "Which phrase gathers the Hams letters?", "o": ["فحثه شخص سكت", "أجد قط بكت", "خص ضغط قظ", "قطب جد"], "a": 0}, {"q": "Which phrase has a light Lam in اللَّه?", "o": ["قَالَ اللَّهُ", "نَصْرُ اللَّهِ", "عَبْدُ اللَّهِ", "بِاللَّهِ"], "a": 3}, {"q": "Which rule applies before ء ه ع ح غ خ?", "o": ["Ikhfa", "Iqlab", "Idgham", "Izhar Halqi"], "a": 3}, {"q": "Which is a well-known example of Idgham Mutajanisayn?", "o": ["قُلْ رَبِّ", "قَدْ تَبَيَّنَ", "مِنْ رَبِّهِمْ", "أَحَدْ"], "a": 1}, {"q": "Where is ض articulated?", "o": ["Tip of tongue with incisors", "Side of the tongue against the upper molars", "Middle throat", "Two lips"], "a": 1}, {"q": "A Madd letter followed by Hamzah in the same word is:", "o": ["Madd Munfasil", "Madd Arid lis-Sukun", "Madd Leen", "Madd Muttasil"], "a": 3}, {"q": "How many main rules are there for Meem Saakinah?", "o": ["Two", "Four", "Five", "Three"], "a": 3}, {"q": "What rule applies in مِنْ شَرِّ?", "o": ["Ikhfa", "Izhar Halqi", "Iqlab", "Idgham without Ghunnah"], "a": 0}, {"q": "How many main rules are there for Noon Saakinah and Tanween?", "o": ["Two", "Three", "Five", "Four"], "a": 3}, {"q": "Meem Saakinah before letters other than ب and م generally has:", "o": ["Ikhfa Shafawi", "Idgham Shafawi", "Izhar Shafawi", "Iqlab"], "a": 2}, {"q": "Meem Saakinah followed by م has which rule?", "o": ["Idgham Shafawi", "Ikhfa Shafawi", "Izhar Shafawi", "Iqlab"], "a": 0}, {"q": "Which set correctly includes key characteristics of ج?", "o": ["Hams, Rikhwah, Isti'la, Itbaq", "Jahr, Shiddah, Istifal, Infitah, Ismat, Qalqalah", "Jahr, Rikhwah, Leen", "Hams, Shiddah, Safir"], "a": 1}, {"q": "How long is Madd Lazim?", "o": ["2 counts", "4 counts", "6 counts", "4 or 5 counts"], "a": 2}, {"q": "In الْقَمَرِ, the Lam of ال is:", "o": ["Assimilated into ق", "Pronounced clearly", "Silent", "Changed into ر"], "a": 1}, {"q": "In the basic rule, Ra with Kasra is generally:", "o": ["Light (Tarqeeq)", "Heavy (Tafkheem)", "Qalqalah", "Idgham"], "a": 0}, {"q": "Fatha normally gives which short sound?", "o": ["Short 'a'", "Short 'i'", "Short 'u'", "Long 'aa'"], "a": 0}, {"q": "Where are ج ش ي (non-Madd Ya) articulated?", "o": ["Deep throat", "Tip of tongue with teeth", "Middle of tongue with the corresponding palate", "Two lips"], "a": 2}, {"q": "Which is a well-known example of Idgham Mutaqaribayn?", "o": ["قَدْ تَبَيَّنَ", "قُلْ رَبِّ", "هَمَّتْ طَائِفَةٌ", "أَحَدْ"], "a": 1}, {"q": "Which letters cause Idgham with Ghunnah?", "o": ["ل ر", "ء ه ع ح غ خ", "ق ط ب ج د", "ي ن م و (ينمو)"], "a": 3}, {"q": "What rule applies in مَنْ يَعْمَلْ?", "o": ["Ikhfa", "Iqlab", "Idgham with Ghunnah", "Izhar Halqi"], "a": 2}, {"q": "What does Sukun indicate?", "o": ["No vowel follows the consonant", "The letter is doubled", "The vowel is long", "The letter has Tanween"], "a": 0}, {"q": "Which letters cause Idgham without Ghunnah?", "o": ["ي and و", "ن and م", "ل and ر", "ب and م"], "a": 2}, {"q": "Idgham Mithlayn occurs when:", "o": ["Two distant letters meet", "Madd meets Hamzah", "Two identical letters meet, first Saakin and second vowelled", "Two unrelated vowelled letters meet"], "a": 2}, {"q": "How long is Madd Tabii?", "o": ["1 count", "2 counts", "4 counts", "6 counts"], "a": 1}, {"q": "Which example has Meem Mushaddadah with Ghunnah?", "o": ["هُمْ", "لَمْ", "ثُمَّ", "قُمْ"], "a": 2}, {"q": "What best describes Tafkheem?", "o": ["Giving a letter a full/heavy resonance", "Making every letter nasal", "Shortening Madd", "Hiding the letter"], "a": 0}, {"q": "Which phrase has a heavy Lam in اللَّه?", "o": ["بِاللَّهِ", "قَالَ اللَّهُ", "بِسْمِ اللَّهِ", "لِلَّهِ"], "a": 1}, {"q": "Which phrase gathers the Shiddah letters?", "o": ["فحثه شخص سكت", "لن عمر", "خص ضغط قظ", "أجد قط بكت"], "a": 3}, {"q": "Damma normally gives which short sound?", "o": ["Short 'u'", "Short 'a'", "Short 'i'", "Long 'oo'"], "a": 0}, {"q": "When stopping on أَحَدْ, which letter has Qalqalah?", "o": ["ح", "د", "أ", "None"], "a": 1}, {"q": "What does Shiddah mean?", "o": ["The sound flows freely", "The sound is nasal", "The letter must be heavy", "The sound is strongly blocked at its articulation point"], "a": 3}, {"q": "What does Rikhwah mean?", "o": ["Complete blockage of sound", "Flow of sound due to incomplete blockage", "Bouncing", "Nasalization"], "a": 1}, {"q": "In the basic rule, Ra with Fatha or Damma is generally:", "o": ["Light (Tarqeeq)", "Silent", "Heavy (Tafkheem)", "Nasalized"], "a": 2}, {"q": "A Madd letter at the end of one word followed by Hamzah at the start of the next is:", "o": ["Madd Munfasil", "Madd Muttasil", "Madd Lazim", "Madd Iwad"], "a": 0}, {"q": "When stopping on عَلِيمًا, what Madd normally occurs?", "o": ["Madd Lazim — 6 counts", "Madd Muttasil", "Madd Iwad — 2 counts", "Madd Silah Kubra"], "a": 2}, {"q": "Which word has Tanween Kasr?", "o": ["كِتَابٍ", "كِتَابٌ", "كِتَابًا", "كِتَابَ"], "a": 0}, {"q": "Which example has Noon Mushaddadah with Ghunnah?", "o": ["مِنْ", "قَدْ", "قُلْ", "إِنَّ"], "a": 3}, {"q": "Which are the Qalqalah letters?", "o": ["خ ص ض غ ط ق ظ", "ء ه ع ح غ خ", "ي ن م و", "ق ط ب ج د (قطب جد)"], "a": 3}, {"q": "Idgham Mutajanisayn occurs when:", "o": ["Two identical letters meet", "Two letters are merely close in articulation", "Two distant letters meet", "Two letters share the same articulation point but differ in characteristics"], "a": 3}, {"q": "Which statement about levels of Ghunnah is correct?", "o": ["All Ghunnah states have exactly equal strength", "Its strength varies by the state/rule; Mushaddad Noon/Meem are among the strongest/fullest", "Ghunnah occurs only with Tanween", "Ghunnah belongs only to Madd letters"], "a": 1}, {"q": "What rule applies in مِنْ رَبِّهِمْ?", "o": ["Iqlab", "Idgham without Ghunnah", "Izhar Halqi", "Idgham with Ghunnah"], "a": 1}, {"q": "When stopping, Madd Arid lis-Sukun may be read:", "o": ["2 only", "4 or 5 only", "2, 4, or 6 counts", "6 only"], "a": 2}, {"q": "Which word has Tanween Fath?", "o": ["كِتَابًا", "كِتَابٌ", "كِتَابٍ", "كِتَابُ"], "a": 0}, {"q": "What rule applies in مِنْ بَعْدِ?", "o": ["Ikhfa", "Iqlab", "Izhar Halqi", "Idgham with Ghunnah"], "a": 1}, {"q": "Which are the three Madd letters?", "o": ["ء ، ه ، ع", "ق ، ط ، ب", "ا ، و ، ي", "ن ، م ، ل"], "a": 2}, {"q": "Meem Saakinah followed by ب has which rule?", "o": ["Idgham Shafawi", "Izhar Shafawi", "Ikhfa Shafawi", "Iqlab"], "a": 2}, {"q": "Which state has one of the strongest/fullest levels of Ghunnah?", "o": ["Clear Noon Saakinah in Izhar", "A Madd letter", "Noon or Meem with Shaddah", "A vowelled Lam"], "a": 2}, {"q": "What type of Madd is in قَالَ?", "o": ["Madd Tabii", "Madd Muttasil", "Madd Lazim", "Madd Iwad"], "a": 0}, {"q": "Which rule applies before ب for Noon Saakinah/Tanween?", "o": ["Iqlab", "Izhar Halqi", "Idgham without Ghunnah", "Ikhfa Shafawi"], "a": 0}, {"q": "Which are the seven Isti'la (always-heavy) letters?", "o": ["خ ص ض غ ط ق ظ (خص ضغط قظ)", "ق ط ب ج د", "ء ه ع ح غ خ", "ي ر م ل و ن"], "a": 0}, {"q": "A letter with Shaddah is equivalent to:", "o": ["One Madd letter", "Two identical letters: first Saakin, second vowelled", "Two different vowelled letters", "A Tanween"], "a": 1}, {"q": "When is Qalqalah heard?", "o": ["Whenever it has Kasra", "Only with Fatha", "Only before Madd", "When a Qalqalah letter is Saakin"], "a": 3}, {"q": "What are the three short vowels (Harakaat)?", "o": ["Fatha, Sukun, and Shaddah", "Alif, Waw, and Ya", "Fatha, Tanween, and Madd", "Fatha, Kasra, and Damma"], "a": 3}, {"q": "How long is the Ghunnah of Noon/Meem Mushaddadah?", "o": ["1 count", "4 counts", "2 counts", "6 counts"], "a": 2}, {"q": "In الشَّمْسِ, the Lam of ال is:", "o": ["Assimilated and not pronounced separately", "Pronounced clearly", "Changed into Meem", "Read with Qalqalah"], "a": 0}, {"q": "What does Hams mean?", "o": ["Complete stoppage of breath", "Flow of breath during pronunciation", "Nasal resonance", "Lengthening"], "a": 1}];let i=0,p=0,lock=false,w=[];const E=x=>document.getElementById(x);
function show(){lock=false;let x=Q[i];E("count").textContent=`Question ${i+1} of 60`;E("score").textContent=`Score: ${p} / 60`;E("fill").style.width=`${(i+1)/60*100}%`;E("q").textContent=x.q;E("opts").innerHTML=x.o.map((v,j)=>`<label class="opt"><input type="radio" name="ans" value="${j}"><span>${String.fromCharCode(65+j)}) ${v}</span></label>`).join("");E("fb").className="fb";E("fb").textContent="";E("check").style.display="inline-block";E("next").style.display="none"}

E("next").onclick=()=>{if(i<59){i++;show();scrollTo(0,0)}else{E("quiz").style.display="none";E("result").style.display="block";let pc=Math.round(p/60*100);E("final").textContent=`${p} / 60 — ${pc}%`;E("msg").textContent=pc>=90?"Excellent Tajweed performance.":pc>=75?"Very good. Review the missed questions.":pc>=60?"Good foundation; more practice is recommended.":"Review the rules and try again.";E("review").innerHTML=w.length?`<b>Questions to review:</b><p>${w.map(n=>n+1).join(", ")}</p>`:"<b>Excellent — all answers are correct.</b>";scrollTo(0,0)}};
