<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>GROUP 5</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.w{max-width:800px;margin:auto;padding:14px}header{text-align:center;padding:18px}h1{margin:0;font-size:31px}.c{background:#fff;border:1px solid #d0d5dd;border-radius:16px;padding:20px}.m{display:flex;justify-content:space-between;color:#667085}.bar{height:8px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:14px 0 22px}#fill{height:100%;background:#2563eb}#q{font-size:20px;line-height:1.65}.op{display:flex;gap:11px;border:1px solid #d0d5dd;border-radius:11px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.55}.op input{width:20px;height:20px}.fb{display:none;margin-top:15px;padding:12px;border-radius:10px;font-weight:bold}.ok{display:block;background:#ecfdf3;color:#15803d}.bad{display:block;background:#fef3f2;color:#b42318}.a{display:flex;gap:10px;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}.p{background:#2563eb;color:white}.s{background:#eef2f6}.r{display:none;text-align:center}.big{font-size:42px;font-weight:bold}.rev{text-align:left;border-top:1px solid #ddd;margin-top:18px;padding-top:15px}@media(max-width:500px){.w{padding:10px}.c{padding:15px}.a{flex-wrap:wrap}.a button{width:100%}}</style></head><body><div class=w><header><h1>GROUP 5</h1></header><section id=quiz class=c><div class=m><span id=ct></span><span id=sc></span></div><div class=bar><div id=fill></div></div><h2 id=q></h2><div id=ops></div><div id=fb class=fb></div><div class=a><button id=ck class=p>Check Answer</button><button id=nx class=s style="display:none">Next Question →</button></div></section><section id=res class="c r"><h2>Assessment Completed</h2><div id=fin class=big></div><p id=msg></p><div id=rev class=rev></div><button id=rs class=p>Restart Quiz</button></section></div><script>const Q=[{"q": "Which letter has Isti'la but not Itbaq?", "o": ["ص", "ض", "ظ", "خ"], "a": 3}, {"q": "When pronouncing تْ, breath can be felt flowing. Which characteristic is illustrated?", "o": ["Jahr", "Itbaq", "Hams", "Qalqalah"], "a": 2}, {"q": "Which example contains a Ra that is light because it directly carries Kasra?", "o": ["رَبُّكُمْ", "رُسُلٌ", "مَرْيَمَ", "رِجَالٌ"], "a": 3}, {"q": "In مَرْيَمَ, how is رْ read?", "o": ["Light because ي follows", "Light because Ra is Saakin", "Heavy because م is heavy", "Heavy: Saakin Ra is preceded by Fatha"], "a": 3}, {"q": "How many counts is Madd Lazim?", "o": ["2 counts", "6 counts", "4 counts", "2, 4, or 6 counts"], "a": 1}, {"q": "In رَبِّ الْعَالَمِينَ, how is ر in رَبِّ read?", "o": ["Light because it is Mushaddad", "Light because ب follows", "Heavy (Tafkheem): Ra has Fatha", "Heavy because of Qalqalah"], "a": 2}, {"q": "In رِزْقًا, how is the first ر read?", "o": ["Heavy because ز follows", "Heavy because Ra is always heavy", "Light (Tarqeeq): Ra has Kasra", "Light because it has Sukun"], "a": 2}, {"q": "Where are ق and ك articulated?", "o": ["Lips", "Middle throat", "Back of tongue; ق is farther back/higher than ك", "Tongue tip"], "a": 2}, {"q": "When stopping on قَدِيرْ, how is final رْ read?", "o": ["Heavy because ق occurs in the word", "Heavy because Ra becomes Saakin", "Light: preceded by Ya Saakinah preceded by Kasra", "Light because د is light"], "a": 2}, {"q": "When stopping on الْحَقّ, final ق is Mushaddad. In the three-degree classification, this is:", "o": ["Qalqalah Sughra", "Qalqalah Akbar", "Qalqalah Kubra", "No Qalqalah"], "a": 1}, {"q": "In وَالطُّورِ, which characteristics make ط especially heavy?", "o": ["Isti'la and Itbaq", "Istifal and Infitah", "Hams and Leen", "Rikhwah and Safir"], "a": 0}, {"q": "Which phrase gathers the Shiddah letters?", "o": ["فحثه شخص سكت", "أجد قط بكت", "لن عمر", "خص ضغط قظ"], "a": 1}, {"q": "When stopping on الْفَلَقْ, which Qalqalah degree occurs on ق?", "o": ["Qalqalah Sughra", "Qalqalah Kubra", "Qalqalah Akbar", "No Qalqalah"], "a": 1}, {"q": "In قُلْ رَبِّ, why is this Mutaqaribayn?", "o": ["They are identical", "They share exactly the same articulation", "ل and ر are close in articulation/characteristics; first is Saakin", "They are Madd letters"], "a": 2}, {"q": "When stopping on الْعَالَمِينَ, which Madd may arise?", "o": ["Madd Badal", "Madd Arid lis-Sukun", "Madd Muttasil", "Madd Silah Kubra"], "a": 1}, {"q": "In قُرْآنٍ, how is رْ read?", "o": ["Light because Hamzah follows", "Light because Ra is Saakin", "Heavy only when stopping", "Heavy: Saakin Ra is preceded by Damma"], "a": 3}, {"q": "When stopping on غَفُورْ, how is final رْ read?", "o": ["Light because Waw is Madd", "Light because final Ra is always light", "Heavy because ف is Isti'la", "Heavy: preceded by Waw Saakinah preceded by Damma"], "a": 3}, {"q": "Where are غ and خ articulated?", "o": ["Deepest throat", "Middle tongue", "Lips", "Nearest part of throat to mouth"], "a": 3}, {"q": "In مُسْلِمٌ, which sequence of signs appears on م س ل م?", "o": ["Fatha, Sukun, Damma, Tanween Fath", "Kasra, Fatha, Sukun, Tanween Kasr", "Damma, Shaddah, Fatha, Sukun", "Damma, Sukun, Kasra, Tanween Damm"], "a": 3}, {"q": "In جَاءَ, which Madd occurs?", "o": ["Madd Munfasil", "Madd Muttasil", "Madd Badal", "Madd Leen"], "a": 1}, {"q": "Which group contains the four Itbaq letters?", "o": ["خ غ ق ظ", "ق ط ب ج", "ص ض ط ظ", "ص س ز ش"], "a": 2}, {"q": "When stopping on الْعَصْرْ, how is final رْ read?", "o": ["Light because ص is Saakin", "Light because stopping makes Ra light", "Heavy: before it is Saakin ص preceded by Fatha", "Heavy because Ra has Qalqalah"], "a": 2}, {"q": "In قَدْ تَبَيَّنَ, why is this Mutajanisayn?", "o": ["د and ت share an articulation point but differ in characteristics", "They are identical", "They are far apart", "They are throat letters"], "a": 0}, {"q": "In قِرْطَاسٍ, how is رْ read?", "o": ["Heavy: ط is an Isti'la letter following it in the same word", "Light because of the preceding Kasra", "Light because ط has Fatha", "Heavy because Ra itself is Isti'la"], "a": 0}, {"q": "Which letter is articulated from the lower lip touching the upper incisors?", "o": ["ب", "م", "ف", "و"], "a": 2}, {"q": "When pronouncing دْ, sound is blocked before release. Which characteristic is illustrated?", "o": ["Rikhwah", "Leen", "Istifal", "Shiddah"], "a": 3}, {"q": "In قَالَ اللَّهُ, how is Lam in اللَّه read?", "o": ["Light because of Shaddah", "Light because Lam is always light", "Heavy: preceded by Fatha", "Heavy because of Qalqalah"], "a": 2}, {"q": "When stopping on الذِّكْرْ, how is final رْ read?", "o": ["Heavy because ك has Shiddah", "Heavy because final Ra is Saakin", "Light because all Ra at Waqf is light", "Light: before it is Saakin ك preceded by Kasra"], "a": 3}, {"q": "When stopping on حَكِيمًا, what normally occurs?", "o": ["Madd Iwad — 2 counts", "Madd Lazim — 6 counts", "Madd Muttasil — 4 or 5", "Madd Leen"], "a": 0}, {"q": "Which letters have Tawassut (Bayniyyah)?", "o": ["ق ط ب ج د", "ل ن ع م ر — لن عمر", "ص ض ط ظ", "ء ه ع ح غ خ"], "a": 1}, {"q": "Which set correctly includes key characteristics of ج?", "o": ["Jahr, Shiddah, Istifal, Infitah, Ismat, Qalqalah", "Hams, Rikhwah, Isti'la, Itbaq", "Hams, Shiddah, Safir, Leen", "Jahr, Rikhwah, Isti'la, Itbaq"], "a": 0}, {"q": "Which letters are articulated by closing the two lips?", "o": ["ف and ب", "ق and ك", "ع and ح", "ب and م"], "a": 3}, {"q": "How long is Ghunnah of Noon or Meem Mushaddadah normally held?", "o": ["2 counts", "1 count", "4 counts", "6 counts"], "a": 0}, {"q": "In يَجْعَلُونَ, جْ is Saakin in the middle. Which Qalqalah degree is this?", "o": ["Qalqalah Kubra", "Qalqalah Akbar", "Qalqalah Sughra", "No Qalqalah"], "a": 2}, {"q": "In رُسُلٌ, how is the first ر read?", "o": ["Light because it begins the word", "Light because س follows", "Heavy (Tafkheem): Ra has Damma", "Heavy because it is Madd"], "a": 2}, {"q": "In مِرْصَادًا, how is رْ read?", "o": ["Heavy: ص is an Isti'la letter following it in the same word", "Light because Kasra always makes Ra light", "Light because ص is light", "Heavy because Ra is Isti'la"], "a": 0}, {"q": "In قُلِ ادْعُوا, why is Lam given a temporary Kasra in connected reading?", "o": ["To create Madd Munfasil", "To make Lam heavy", "To avoid the meeting of two Saakin letters after Hamzat al-Wasl drops", "To produce Qalqalah"], "a": 2}, {"q": "In بِاللَّهِ, how is Lam in اللَّه read?", "o": ["Light: preceded by Kasra", "Heavy because it is Allah", "Heavy because Lam is Mushaddad", "Light because of Sukun"], "a": 0}, {"q": "Where are ج ش ي (non-Madd Ya) articulated?", "o": ["Deepest throat", "Middle of tongue with corresponding palate", "Two lips", "Tongue tip with upper incisors"], "a": 1}, {"q": "In رَبِّ, what does Shaddah on ب represent?", "o": ["Two ب letters: first Saakin, second carrying Kasra", "One long ب for six counts", "A hidden Noon after ب", "Qalqalah only"], "a": 0}, {"q": "When beginning ارْجِعُوا, how is رْ read?", "o": ["Light because any Kasra makes Ra light", "Light because ج has Kasra", "Heavy because ج is Isti'la", "Heavy: the preceding Kasra on Hamzat al-Wasl is temporary"], "a": 3}, {"q": "Which example matches Idgham Mithlayn: two identical letters, first Saakin and second vowelled?", "o": ["قُلْ رَبِّ", "قَدْ تَبَيَّنَ", "مِنْ شَرِّ", "اضْرِبْ بِعَصَاكَ — بْ followed by ب"], "a": 3}, {"q": "Where are ع and ح articulated?", "o": ["Middle of the throat", "Deepest throat", "Nearest throat to mouth", "Lips"], "a": 0}, {"q": "In آمَنَ, the initial long sound is:", "o": ["Madd Badal", "Madd Munfasil", "Madd Leen", "Madd Lazim"], "a": 0}, {"q": "Where are ء and ه articulated?", "o": ["Middle throat", "Side of tongue", "Lips", "Deepest part of the throat"], "a": 3}, {"q": "When stopping on بَيْتْ, Ya Saakinah preceded by Fatha may produce:", "o": ["Madd Badal", "Madd Leen", "Madd Muttasil", "Madd Silah"], "a": 1}, {"q": "In فِرْعَوْنَ, how is رْ read?", "o": ["Heavy because ع follows", "Heavy because Ra is Saakin", "Light because every Saakin Ra is light", "Light: Saakin Ra is preceded by an original Kasra"], "a": 3}, {"q": "In الضَّالِّينَ, which Madd occurs before the permanent Shaddah?", "o": ["Madd Lazim Kalimi Muthaqqal", "Madd Tabii", "Madd Badal", "Madd Arid lis-Sukun"], "a": 0}, {"q": "When pronouncing س, its sound continues to flow. Which characteristic is illustrated?", "o": ["Rikhwah", "Shiddah", "Qalqalah", "Isti'la"], "a": 0}, {"q": "Which are the Qalqalah letters?", "o": ["خ ص ض غ ط ق ظ", "ف ح ث ه ش خ ص س ك ت", "ق ط ب ج د — قطب جد", "ل ن ع م ر"], "a": 2}, {"q": "Where is ض articulated?", "o": ["Two lips", "Side of tongue against upper molars", "Middle throat", "Tongue tip with lower incisors"], "a": 1}, {"q": "When ال meets a sun letter as in الشَّمْسُ, how is the Saakin Lam handled?", "o": ["It receives Tanween", "It assimilates into the following sun letter", "The sun letter is deleted", "A Madd letter is inserted"], "a": 1}, {"q": "Which group contains all seven Isti'la letters?", "o": ["ص ض ط ظ", "ق ط ب ج د", "ء ه ع ح غ خ", "خ ص ض غ ط ق ظ — خص ضغط قظ"], "a": 3}, {"q": "Which phrase gathers the ten Hams letters?", "o": ["فحثه شخص سكت", "أجد قط بكت", "لن عمر", "خص ضغط قظ"], "a": 0}, {"q": "In يَا أَيُّهَا, which Madd occurs?", "o": ["Madd Muttasil", "Madd Munfasil", "Madd Lazim", "Madd Iwad"], "a": 1}, {"q": "In عَلَيْكُمُ الصِّيَامُ, why may Meem receive a temporary Damma in connected reading?", "o": ["Because Meem always takes Damma before ال", "To avoid the meeting of two Saakin letters", "To make a Madd", "To make the word plural"], "a": 1}, {"q": "Why is a temporary vowel sometimes used when two Saakin letters would meet in connected reading?", "o": ["To prevent an impermissible meeting of two consecutive Saakins and ease pronunciation", "To lengthen every word six counts", "To create Qalqalah", "To make both letters Mushaddad"], "a": 0}, {"q": "Which order represents Ghunnah from strongest/fullest toward weaker states?", "o": ["Vowelled → Izhar → Mukhfa → Mudgham → Mushaddad", "Mushaddad → Mudgham → Mukhfa → Saakin with Izhar → vowelled Noon/Meem", "Izhar → Mushaddad → vowelled → Mukhfa → Mudgham", "All states are equal"], "a": 1}, {"q": "In مِنَ الْجِنَّةِ, why is Noon in مِنَ given Fatha in connected reading?", "o": ["Because Noon before Lam always takes Fatha", "To avoid the meeting of two Saakin letters", "To create Ghunnah", "Because it is Tanween"], "a": 1}, {"q": "When stopping on خَبِيرْ, how is final رْ read?", "o": ["Heavy because final Ra is always heavy", "Heavy because stopping creates Sukun", "Light: it is preceded by Ya Saakinah preceded by Kasra", "Light because every final letter is light"], "a": 2}];let i=0,s=0,l=false,w=[];const E=x=>document.getElementById(x);function sh(){l=false;let x=Q[i];E("ct").textContent=`Question ${i+1} of 60`;E("sc").textContent=`Score: ${s} / 60`;E("fill").style.width=`${(i+1)/60*100}%`;E("q").textContent=x.q;E("ops").innerHTML=x.o.map((v,j)=>`<label class=op><input type=radio name=z value=${j}><span>${String.fromCharCode(65+j)}) ${v}</span></label>`).join("");E("fb").className="fb";E("fb").textContent="";E("ck").style.display="inline-block";E("nx").style.display="none"}E("ck").onclick=()=>{if(l)return;let z=document.querySelector('input[name=z]:checked');if(!z){E("fb").className="fb bad";E("fb").textContent="Please choose an answer first.";return}l=true;document.querySelectorAll('input[name=z]').forEach(x=>x.disabled=true);let r=+z.value===Q[i].a;if(r)s++;else w.push(i);E("fb").className="fb "+(r?"ok":"bad");E("fb").textContent=r?"✓ Correct!":"✗ Incorrect. Correct answer: "+String.fromCharCode(65+Q[i].a)+") "+Q[i].o[Q[i].a];E("sc").textContent=`Score: ${s} / 60`;E("ck").style.display="none";E("nx").style.display="inline-block";E("nx").textContent=i===59?"Show Final Result":"Next Question →"};E("nx").onclick=()=>{if(i<59){i++;sh();scrollTo(0,0)}else{E("quiz").style.display="none";E("res").style.display="block";let p=Math.round(s/60*100);E("fin").textContent=`${s} / 60 — ${p}%`;E("msg").textContent=p>=90?"Excellent Tajweed performance.":p>=75?"Very good. Review the missed questions.":p>=60?"Good foundation; more practice is recommended.":"Review the rules and try again.";E("rev").innerHTML=w.length?`<b>Questions to review:</b><p>${w.map(n=>n+1).join(", ")}</p>`:"<b>Excellent — all answers are correct.</b>"}};E("rs").onclick=()=>{i=s=0;w=[];E("res").style.display="none";E("quiz").style.display="block";sh()};sh();</script></body></html>
